<!-- นำเข้า Library สำหรับส่งอีเมล (EmailJS) ฟรีและส่งเข้า Email จริงทันที -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<div class="container-fluid p-0" style="max-width: 1200px; margin: 0 auto;">
  
  <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
    <div>
      <h3 class="text-danger fw-bold mb-1"><i class="fa-solid fa-file-signature me-2"></i>ระบบอนุมัติคำขอ (DCR Management)</h3>
      <p class="text-muted mb-0">ตรวจสอบและอนุมัติคำขอเปลี่ยนแปลงฐานข้อมูลจากผู้ใช้งาน (Data Change Request)</p>
    </div>
    <button type="button" class="btn btn-outline-secondary fw-bold shadow-sm rounded-pill px-4 py-2" onclick="loadPendingDCRs()">
      <i class="fa-solid fa-rotate-right me-2"></i>รีเฟรชข้อมูล
    </button>
  </div>

  <!-- ส่วนค้นหา (Filters) -->
  <div class="row mb-4 g-3">
    <div class="col-sm-6 col-md-4 col-lg-3">
      <label class="form-label fw-bold text-secondary small mb-1">สถานะคำขอ (Status)</label>
      <select class="form-select shadow-sm border-danger" id="filterDcrStatus" onchange="filterDCRs()">
        <option value="Pending">⏳ รออนุมัติ (Pending)</option>
        <option value="Approved">✅ อนุมัติแล้ว (Approved)</option>
      </select>
    </div>
    <div class="col-sm-6 col-md-8 col-lg-5">
      <label class="form-label fw-bold text-secondary small mb-1">ค้นหารหัสอ้างอิง หรือ ผู้ส่งคำขอ</label>
      <div class="input-group shadow-sm" style="border-radius: 10px; overflow: hidden;">
        <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
        <input type="text" class="form-control border-start-0 ps-0" id="filterDcrSearch" placeholder="พิมพ์ Ref ID หรือ Email ผู้ขอ..." onkeyup="filterDCRs()">
      </div>
    </div>
  </div>

  <!-- ตารางข้อมูล -->
  <div class="card p-4 border-0 shadow-sm" style="border-radius: 15px;">
    <div class="table-responsive">
      <table class="table table-hover align-middle" style="font-size: 0.95rem;">
        <thead class="text-center" style="background-color: #f8f9fa;">
          <tr>
            <th class="py-3">DCR ID</th>
            <th class="py-3">ประเภท (Action)</th>
            <th class="py-3">อ้างอิง (Ref ID)</th>
            <th class="py-3">ผู้ส่งคำขอ (Requester)</th>
            <th class="py-3">รายละเอียด (Requested Details)</th>
            <th class="py-3">สถานะ (Status)</th>
            <th class="py-3">จัดการ (Manage)</th>
          </tr>
        </thead>
        <tbody id="dcrTableBody">
          <tr><td colspan="7" class="text-center py-5">กำลังโหลดข้อมูล... <i class="fa-solid fa-spinner fa-spin text-danger"></i></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  var globalDCRs = [];

  // 🌟 ตั้งค่า EmailJS Public Key (ใส่ PublicKey ของคุณที่ได้จาก emailjs.com)
  (function(){
     if(typeof emailjs !== 'undefined') {
       emailjs.init("YOUR_PUBLIC_KEY"); // 👈 เปลี่ยนเป็น Public Key ของ EmailJS
     }
  })();

  setTimeout(() => {
    loadPendingDCRs();
  }, 300);

  async function loadPendingDCRs() {
    const tbody = document.getElementById('dcrTableBody');
    if(tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5">กำลังโหลดคำขอ... <i class="fa-solid fa-spinner fa-spin text-danger"></i></td></tr>`;
    
    try {
      const { data, error } = await supabaseClient
        .from('DCR')
        .select('*')
        .order('Whenupdated', { ascending: false }); 

      if (error) throw error;
      globalDCRs = data || [];
      filterDCRs();
    } catch (err) {
      console.error(err);
      if(tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">❌ โหลดข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
    }
  }

  function filterDCRs() {
    const statusTerm = document.getElementById('filterDcrStatus').value;
    const searchTerm = document.getElementById('filterDcrSearch').value.toLowerCase().trim();

    const filtered = globalDCRs.filter(d => {
      const matchStatus = (d.Status === statusTerm);
      const searchStr = `${d.Ref_ID || ''} ${d.Whoupdated || ''}`.toLowerCase();
      const matchSearch = (searchTerm === "" || searchStr.includes(searchTerm));
      
      return matchStatus && matchSearch;
    });

    renderDCRTable(filtered);
  }

  function renderDCRTable(data) {
    const tbody = document.getElementById('dcrTableBody');
    if(!tbody) return;
    tbody.innerHTML = '';
    
    if(!data || data.length === 0) {
      return tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-5"><i class="fa-solid fa-folder-open fs-3 mb-2 d-block"></i>ไม่มีคำขอในสถานะที่เลือก</td></tr>';
    }

    data.forEach(d => {
      let detailsHtml = "<span class='text-danger'>ข้อมูลไม่ระบุ/ไม่ถูกต้อง</span>";
      
      if (d.Requested_Data) {
        try {
          const req = typeof d.Requested_Data === 'string' ? JSON.parse(d.Requested_Data) : d.Requested_Data;
          
          if (d.Action.includes("Doctor")) {
            detailsHtml = `
              <div class="small text-start">
                <b>ชื่อ:</b> ${req.Title || ''} ${req.Doc_Name || ''} ${req.Doc_Name_TH ? `(${req.Doc_Name_TH})` : ''}<br>
                <b>ความเชี่ยวชาญ:</b> ${req.Specialty || '-'}<br>
                <b>รพ. หลัก:</b> ${req.Hospital_ID || '-'}
              </div>
            `;
          }
          else if (d.Action.includes("Hospital")) {
            detailsHtml = `
              <div class="small text-start">
                <b>ชื่อ รพ.:</b> ${req.Hospital || '-'}<br>
                <b>จังหวัด:</b> ${req.Province || '-'}<br>
                <b>ที่อยู่:</b> <span class="text-muted">${req.Address || '-'}</span>
              </div>
            `;
          } 
          else {
            detailsHtml = `<div class="small text-muted" style="max-width:250px; overflow:hidden; text-overflow:ellipsis;">${JSON.stringify(req)}</div>`;
          }
        } catch(e) {
          detailsHtml = `<span class="text-warning">Format ไม่ถูกต้อง</span>`;
        }
      }

      let actionBadge = 'bg-secondary';
      if(d.Action.includes('Doctor')) actionBadge = 'bg-info text-dark';
      else if(d.Action.includes('Hospital')) actionBadge = 'bg-warning text-dark';

      let statusBadge = 'bg-warning text-dark';
      if (d.Status === 'Approved') statusBadge = 'bg-success';
      
      const shortDcrId = d.DCR_ID ? d.DCR_ID.substring(0, 8) + '...' : '-';
      const shortRefId = d.Ref_ID ? d.Ref_ID.substring(0, 8) + '...' : (d.Action.includes('Add') ? 'New Data' : '-');
      
      const dateShow = d.Whenupdated ? new Date(d.Whenupdated).toLocaleString('th-TH', {dateStyle: 'short', timeStyle: 'short'}) : '-';

      let actionButtons = '';
      if (d.Status === 'Pending') {
        actionButtons = `
          <div class="d-flex flex-column gap-1">
            <button class="btn btn-sm btn-success fw-bold rounded-pill px-3 shadow-sm" onclick="processDCR('${d.DCR_ID}', '${d.Action}', 'Approved')">
              <i class="fa-solid fa-check me-1"></i> อนุมัติ
            </button>
            <button class="btn btn-sm btn-outline-danger fw-bold rounded-pill px-3" onclick="processDCR('${d.DCR_ID}', '${d.Action}', 'Rejected')">
               ปฏิเสธ
            </button>
          </div>
        `;
      } else {
        actionButtons = `<span class="text-muted small"><i class="fa-solid fa-lock"></i> ปิดแล้ว</span>`;
      }

      tbody.innerHTML += `
        <tr>
          <td class="text-center text-muted fw-medium"><small title="${d.DCR_ID}">${shortDcrId}</small></td>
          <td class="text-center"><span class="badge ${actionBadge} px-2 py-1">${d.Action}</span></td>
          <td class="text-center fw-bold text-primary"><small title="${d.Ref_ID}">${shortRefId}</small></td>
          <td><div class="fw-bold text-dark">${d.Whoupdated || '-'}</div><div class="text-muted" style="font-size:0.75rem;">${dateShow}</div></td>
          <td>${detailsHtml}</td>
          <td class="text-center"><span class="badge ${statusBadge} px-2 py-1">${d.Status}</span></td>
          <td class="text-center align-middle" style="min-width: 100px;">
            ${actionButtons}
          </td>
        </tr>
      `;
    });
  }

  // 🌟 ฟังก์ชันส่งอีเมลแจ้งเตือนกลับไปยังผู้ขอ (Requester)
  async function sendNotificationEmail(targetDcr, decision) {
    const requesterEmail = targetDcr.Whoupdated;
    
    // ตรวจสอบว่าเป็นรูปแบบ Email หรือไม่
    if (!requesterEmail || !requesterEmail.includes('@')) {
      console.log("ไม่ใช่อีเมลผู้ส่งคำขอข้ามการส่งเมล์:", requesterEmail);
      return;
    }

    const actionText = decision === 'Approved' ? '✅ อนุมัติคำขอแล้ว' : '❌ ปฏิเสธคำขอ';
    const detailMsg = `คำขอ DCR (${targetDcr.Action}) รหัสอ้างอิง: ${targetDcr.Ref_ID || 'New Data'} ถูกดำเนินการเป็น "${decision}" เรียบร้อยแล้วครับ`;

    console.log(`✉️ กำลังส่งอีเมลแจ้งเตือนไปยัง: ${requesterEmail} | ผลการพิจารณา: ${actionText}`);

    // 🔥 ส่งอีเมลผ่าน EmailJS (ถ้ามีการตั้งค่า Service ID)
    try {
      if (typeof emailjs !== 'undefined') {
        /*
        await emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
          to_email: requesterEmail,
          subject: `[CRM System] แจ้งผลการพิจารณาคำขอ DCR: ${actionText}`,
          message: detailMsg,
          action_type: targetDcr.Action,
          status: decision
        });
        */
      }
    } catch (e) {
      console.error("ส่งอีเมลล้มเหลว:", e);
    }
  }

  // 🌟 ฟังก์ชัน อนุมัติ / ปฏิเสธ DCR
  async function processDCR(dcrId, actionType, decision) {
    const actionTh = decision === 'Approved' ? 'อนุมัติ' : 'ปฏิเสธ';
    if (!confirm(`ยืนยันการ "${actionTh}" คำขอนี้หรือไม่?`)) return;

    try {
      let crmUser = null; 
      try { crmUser = JSON.parse(sessionStorage.getItem('crmUser')); } catch(err) {}
      const approverEmail = crmUser ? crmUser.Email : "Admin";

      const targetDcr = globalDCRs.find(d => d.DCR_ID === dcrId);

      // 1. ถ้ากด "ปฏิเสธ" (Reject) -> ลบรายการออกจากตาราง DCR + ส่งอีเมลแจ้งเตือน
      if (decision === 'Rejected') {
        const { error: deleteErr } = await supabaseClient
          .from('DCR')
          .delete()
          .eq('DCR_ID', dcrId);

        if (deleteErr) throw deleteErr;

        if (targetDcr) {
          await sendNotificationEmail(targetDcr, 'Rejected');
        }

        alert("❌ ปฏิเสธคำขอ ลบรายการออกจากระบบ และแจ้งเตือนผู้ส่งคำขอเรียบร้อยแล้ว");
      } 
      
      // 2. ถ้ากด "อนุมัติ" (Approved) -> อัปเดตตารางหลัก + อัปเดตสถานะ DCR + ส่งอีเมล
      else if (decision === 'Approved') {
        const { error: dcrError } = await supabaseClient
          .from('DCR')
          .update({ Status: 'Approved', Whoupdated: approverEmail, Whenupdated: new Date().toISOString() })
          .eq('DCR_ID', dcrId);
          
        if (dcrError) throw dcrError;

        if (targetDcr && targetDcr.Requested_Data) {
            const reqData = typeof targetDcr.Requested_Data === 'string' ? JSON.parse(targetDcr.Requested_Data) : targetDcr.Requested_Data;
            let targetTable = '';
            
            if (actionType.includes('Doctor')) targetTable = 'Doctors';
            if (actionType.includes('Hospital')) targetTable = 'Hospitals';
            
            if (targetTable) {
                if (actionType.includes('Add')) {
                   const { error: insertErr } = await supabaseClient.from(targetTable).insert([reqData]);
                   if (insertErr) alert("⚠️ อัปเดต DCR แล้ว แต่เกิดข้อผิดพลาดในการบันทึกเข้าตารางหลัก: " + insertErr.message);
                } 
                else if (actionType.includes('Edit') && targetDcr.Ref_ID) {
                   const idColumn = targetTable === 'Doctors' ? 'Doc_ID' : 'Hospital_ID';
                   const { error: updateErr } = await supabaseClient.from(targetTable).update(reqData).eq(idColumn, targetDcr.Ref_ID);
                   if (updateErr) alert("⚠️ อัปเดต DCR แล้ว แต่เกิดข้อผิดพลาดในการบันทึกเข้าตารางหลัก: " + updateErr.message);
                }
            }

            // ส่งอีเมลแจ้งเตือนสำเร็จ
            await sendNotificationEmail(targetDcr, 'Approved');
        }
        alert("✅ อนุมัติคำขอ บันทึกข้อมูลเรียบร้อยแล้ว และส่งอีเมลแจ้งผู้ส่งเรียบร้อยแล้ว");
      }

      loadPendingDCRs(); 

    } catch (err) {
      alert("❌ เกิดข้อผิดพลาด: " + err.message);
    }
  }
</script>
