<style>

  }
  .visit-filter-group.ready {
    opacity: 1 !important;
  }

  }

    background-color: #f8fafc !important;
    color: #64748b !important;

<script>
  function safeTranslate(key, fallbackText) {
    if (typeof t === 'function') {
      const res = t(key);
      return res !== key ? res : fallbackText;
    }
    return fallbackText;
  }

  // 🌟 ฟังก์ชันดึง Primary Hospital ตามลอจิกมาตรฐาน CRM
  function getHospitalNameFromDocOrVisit(docObj, visitObj) {
    let targetPrimaryHospId = null;

    if (docObj) {
      // 1. เช็ค Primary Direct ID จากคอลัมน์ Hospital_ID ก่อน
      targetPrimaryHospId = docObj.Hospital_ID || docObj.hospital_id;

      // 2. ถ้าในคอลัมน์ปกติไม่มี ให้แกะ Workplaces_JSON หาเฉพาะก้อนที่เป็น Primary ("isPrimary": true)
      if (!targetPrimaryHospId && docObj.Workplaces_JSON) {
        try {
          let workplaces = typeof docObj.Workplaces_JSON === 'string' 
            ? JSON.parse(docObj.Workplaces_JSON) 
            : docObj.Workplaces_JSON;

          if (Array.isArray(workplaces) && workplaces.length > 0) {
            let primaryItem = workplaces.find(w => w.isPrimary === true || w.isPrimary === 'true' || w.type === 'Primary' || w.Type === 'Primary');
            if (!primaryItem) primaryItem = workplaces[0];

            targetPrimaryHospId = primaryItem.hospitalId || primaryItem.Hospital_ID || primaryItem.hospital_id;
          }
        } catch (e) {
          console.error("Parse Workplaces_JSON error:", e);
        }
      }

      if (targetPrimaryHospId) {
        const hospObj = globalAllHospitals.find(h => 
          String(h.Hospital_ID || h.id || h.Hospital).trim().toLowerCase() === String(targetPrimaryHospId).trim().toLowerCase()
        );
        if (hospObj) return hospObj.Known_As || hospObj.Hospital;
        if (typeof targetPrimaryHospId === 'string' && targetPrimaryHospId.length > 2 && !targetPrimaryHospId.includes('-')) {
          return targetPrimaryHospId;
        }
      }

      // 3. ค้นหาในตาราง Assignment
      if (window.VisitManagerCache && window.VisitManagerCache.assignments) {
        const docIdStr = String(docObj.Doc_ID || docObj.doc_id || docObj.id);
        const matchedAssign = window.VisitManagerCache.assignments.find(a => 
          String(a.Account_ID || a.Doc_ID) === docIdStr && (a.Type === 'Doctor' || a.Type === 'Workplace')
        );
        if (matchedAssign) {
          const assignHospId = matchedAssign.Hospital_ID || matchedAssign.Workplace_ID;
          const hospObj = globalAllHospitals.find(h => String(h.Hospital_ID || h.id) === String(assignHospId));
          if (hospObj) return hospObj.Known_As || hospObj.Hospital;
        }
      }
    }

    // 4. Fallback: ดึงจากฟิลด์ Hospital ใน Visit_Logs
    if (visitObj) {
      const directHosp = visitObj.Hospital || visitObj.Hospital_Name || visitObj.hospital;
      if (directHosp && String(directHosp).trim() !== '' && directHosp !== '-') return directHosp;
    }

    return '-';
  }

  var searchRecognition;
  var currentSearchInputId = null;
  var currentSearchBtnId = null;
  var currentSearchIconId = null;

  function toggleSpeechSearch(inputId, btnId, iconId) {
    if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
      return alert("ขออภัยครับ เบราว์เซอร์ของคุณไม่รองรับระบบสั่งงานด้วยเสียง");
    }

    if (searchRecognition && currentSearchInputId === inputId) {
      stopSearchDictation();
      return;
    }

    if (searchRecognition) stopSearchDictation();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    searchRecognition = new SpeechRecognition();
    searchRecognition.lang = 'th-TH';
    searchRecognition.continuous = false;
    searchRecognition.interimResults = false;

    currentSearchInputId = inputId;
    currentSearchBtnId = btnId;
    currentSearchIconId = iconId;

    const btn = document.getElementById(btnId);
    const icon = document.getElementById(iconId);

    if (btn && icon) {
      btn.classList.add('mic-active');
      if (icon) icon.classList.add('fa-fade');
    }

    searchRecognition.onresult = function(event) {
      let spokenText = event.results[0][0].transcript.trim();
      const inputEl = document.getElementById(inputId);
      if (inputEl && spokenText) {
          inputEl.value = spokenText;
          filterVisits();
      }
      stopSearchDictation();
    };

    searchRecognition.onerror = stopSearchDictation;
    searchRecognition.onend = stopSearchDictation;
    searchRecognition.start();
  }

  function stopSearchDictation() {
    if (searchRecognition) {
      searchRecognition.stop();
      searchRecognition = null;
    }
    if (currentSearchBtnId && currentSearchIconId) {
      const btn = document.getElementById(currentSearchBtnId);
      const icon = document.getElementById(currentSearchIconId);
      if (btn && icon) {
        btn.classList.remove('mic-active');
        if (icon) icon.classList.remove('fa-fade');
      }
    }
    currentSearchInputId = null;
    currentSearchBtnId = null;
    currentSearchIconId = null;
  }

  async function fetchAllRecords(tableName, queryModifier = null) {
      let allData = [];
      let start = 0;
      const step = 1000;
      while (true) {
          let query = supabaseClient.from(tableName).select('*').range(start, start + step - 1);
          if (queryModifier) query = queryModifier(query);
          const { data, error } = await query;
          if (error) throw error;
          allData = allData.concat(data);
          if (data.length < step) break;
          start += step;
      }
      return allData;
  }

  function setupFiltersDropdowns(crmUser, productsTeamList) {
    const repSelect = document.getElementById('filterVisitRep'); 
    const terSelect = document.getElementById('filterVisitTerritory');
    if (!repSelect || !terSelect) return;

    const userRole = crmUser ? String(crmUser.Role || crmUser.role || '').trim() : ''; 
    const rawScope = crmUser ? String(crmUser.BU_ID || crmUser.Team_ID || crmUser.team_id || crmUser.teamId || crmUser.Team || crmUser.Territory_ID || crmUser.territory_id || crmUser.territoryId || crmUser.Territory || '').trim() : '';
    const userRepId = crmUser ? String(crmUser.Rep_ID || crmUser.id || crmUser.User_ID || '').trim() : '';
    const userEmail = crmUser ? String(crmUser.Email || crmUser.email || '').trim().toLowerCase() : '';

    let isGlobalViewer = false;
    if (!rawScope || rawScope.toUpperCase().startsWith('ALL')) isGlobalViewer = true;
    const globalRoles = ['ADMIN', 'STAFF', 'DIRECTOR', 'EXECUTIVE', 'PRODUCT MANAGER'];
    if (globalRoles.includes(userRole.toUpperCase())) isGlobalViewer = true;
    window.myIsGlobalViewer = isGlobalViewer; 

    let allowedTeamIds = [];
    let allowedTerIds = [];
    let allowedRepIds = [];
    let allowedEmails = [];
    let allowedNames = [];

    if (isGlobalViewer) {
      allowedTeamIds = globalTeamList.map(t => String(t.Team_ID));
      allowedTerIds = globalTerritoryList.map(t => String(t.Territory_ID));
      allowedRepIds = globalUsersList.map(u => String(u.Rep_ID || u.User_ID || u.id));
      allowedEmails = globalUsersList.map(u => String(u.Email).toLowerCase());
      allowedNames = globalUsersList.map(u => String(u.Rep_Name || u.Name).toLowerCase());
    } else {
      let userTeamId = crmUser ? String(crmUser.Team_ID || crmUser.team_id || crmUser.Team || '').trim() : '';

      if (userRole === 'BU Head' || userRole === 'BU') {
          const buList = window.VisitManagerCache.bus || [];
          const matchedBu = buList.find(b => String(b.BU_ID) === rawScope || String(b.BU) === rawScope || String(b.BU_Name) === rawScope);
          const targetBuId = matchedBu ? String(matchedBu.BU_ID) : rawScope;

          const buTeams = globalTeamList.filter(t => String(t.BU_ID) === targetBuId || String(t.BU) === rawScope || String(t.BU_ID) === String(rawScope));
          buTeams.forEach(t => {
              allowedTeamIds.push(String(t.Team_ID));
              const terrs = globalTerritoryList.filter(ter => String(ter.Team_ID) === String(t.Team_ID));
              terrs.forEach(ter => allowedTerIds.push(String(ter.Territory_ID)));
          });
          
          if (allowedTeamIds.length === 0) {
            globalTeamList.forEach(t => allowedTeamIds.push(String(t.Team_ID)));
          }

      } else if (userRole === 'Manager' || userRole === 'Sales Manager') {
          let matchedTeam = globalTeamList.find(t => String(t.Team_ID) === rawScope || String(t.Team) === rawScope);
          if (matchedTeam) {
              allowedTeamIds.push(String(matchedTeam.Team_ID));
              const terrsInTeam = globalTerritoryList.filter(t => String(t.Team_ID) === String(matchedTeam.Team_ID));
              terrsInTeam.forEach(t => allowedTerIds.push(String(t.Territory_ID)));
          } else if (rawScope) {
              allowedTeamIds.push(rawScope);
              const terrsInTeam = globalTerritoryList.filter(t => String(t.Team_ID) === rawScope);
              terrsInTeam.forEach(t => allowedTerIds.push(String(t.Territory_ID)));
          }
      } else { 
          let matchedTerr = globalTerritoryList.find(t => String(t.Territory_ID) === rawScope || String(t.Territory) === rawScope);
          if (matchedTerr) {
              allowedTerIds.push(String(matchedTerr.Territory_ID));
              if (matchedTerr.Team_ID) allowedTeamIds.push(String(matchedTerr.Team_ID));
          } else if (rawScope) {
              allowedTerIds.push(rawScope);
          }
          if (userTeamId && !allowedTeamIds.includes(userTeamId)) {
              allowedTeamIds.push(userTeamId);
          }
      }

      if (userRepId) allowedRepIds.push(userRepId);
      if (userEmail) allowedEmails.push(userEmail);
      const userName = crmUser ? String(crmUser.Rep_Name || crmUser.Name || crmUser.name || '').trim().toLowerCase() : '';
      if (userName) allowedNames.push(userName);

      const subUsers = globalUsersList.filter(u => {
          const uTeam = String(u.Team_ID || u.Team || u.team_id || '');
          const uTerr = String(u.Territory_ID || u.Territory || u.territoryId || '');
          const uScope = String(u.Scope || u.scope || u.BU_ID || u.BU || '');
          return allowedTeamIds.includes(uTeam) || allowedTerIds.includes(uTerr) || uScope === rawScope;
      });

      subUsers.forEach(u => {
          const rId = String(u.Rep_ID || u.User_ID || u.id);
          const rEm = String(u.Email).toLowerCase();
          const rNm = String(u.Rep_Name || u.Name).toLowerCase();
          if (rId && rId !== 'undefined' && rId !== 'null') allowedRepIds.push(rId);
          if (rEm && rEm !== 'undefined' && rEm !== 'null') allowedEmails.push(rEm);
          if (rNm && rNm !== 'undefined' && rNm !== 'null') allowedNames.push(rNm);
      });
    }

    window.myAllowedTeamIds = allowedTeamIds;
    window.myAllowedTerIds = allowedTerIds;
    window.myAllowedRepIds = allowedRepIds;
    window.myAllowedEmails = allowedEmails;
    window.myAllowedNames = allowedNames;

    // 🌟 ดร็อปดาวน์พนักงาน
    const uniqueUsersMap = new Map();
    window.fullAllowedUsers = isGlobalViewer ? globalUsersList : globalUsersList.filter(u => allowedRepIds.includes(String(u.Rep_ID || u.User_ID || u.id)));
    if (window.fullAllowedUsers.length === 0) window.fullAllowedUsers = globalUsersList;

    window.fullAllowedUsers.forEach(u => {
        const id = String(u.Rep_ID || u.User_ID || u.id);
        if(id && id !== 'undefined' && id !== 'null') uniqueUsersMap.set(id, u);
    });

    let repHtml = `<option value="">${safeTranslate('opt_all_users', '- ทั้งหมด -')}</option>`;
    uniqueUsersMap.forEach((u, id) => { repHtml += `<option value="${id}">${u.Rep_Name || u.Name || u.Email}</option>`; });
    repSelect.innerHTML = repHtml;

    // 🌟 ดร็อปดาวน์เขตพื้นที่
    window.fullAllowedTerritories = isGlobalViewer ? globalTerritoryList : globalTerritoryList.filter(t => allowedTerIds.includes(String(t.Territory_ID)));
    if (window.fullAllowedTerritories.length === 0) window.fullAllowedTerritories = globalTerritoryList;

    let tHtml = `<option value="">${safeTranslate('opt_all_territories', '- ทั้งหมด -')}</option>`;
    window.fullAllowedTerritories.forEach(t => tHtml += `<option value="${t.Territory_ID}">${t.Territory}</option>`);
    terSelect.innerHTML = tHtml;

    renderFormProductDropdown(crmUser);
  }

  function renderFormProductDropdown(targetRepUser = null) {
    const formProdSelect = document.getElementById('visitProductId');
    if (!formProdSelect) return;

    let crmUser = targetRepUser;
    if (!crmUser) {
      try { crmUser = JSON.parse(sessionStorage.getItem('crmUser')); } catch(e){}
    }

    let allowedTeamIds = window.myAllowedTeamIds || [];
    let isGlobal = window.myIsGlobalViewer;

    if (crmUser && !isGlobal) {
        const uRole = String(crmUser.Role || crmUser.role || '').trim();
        const uTeam = String(crmUser.Team_ID || crmUser.team_id || crmUser.Team || '').trim();
        const uTerr = String(crmUser.Territory_ID || crmUser.territory_id || crmUser.territoryId || crmUser.Territory || '').trim();

        if (['ADMIN', 'STAFF', 'DIRECTOR', 'EXECUTIVE', 'PRODUCT MANAGER'].includes(uRole.toUpperCase())) {
            isGlobal = true;
        } else {
            if (uTeam && !allowedTeamIds.includes(uTeam)) allowedTeamIds.push(uTeam);
            if (uTerr) {
                const foundTerr = globalTerritoryList.find(t => String(t.Territory_ID) === uTerr || String(t.Territory) === uTerr);
                if (foundTerr && foundTerr.Team_ID && !allowedTeamIds.includes(String(foundTerr.Team_ID))) {
                    allowedTeamIds.push(String(foundTerr.Team_ID));
                }
            }
        }
    }

    let allowedProducts = [];
    if (isGlobal) {
        allowedProducts = globalProductsList;
    } else {
        if (allowedTeamIds.length > 0 && window.VisitManagerCache.teamProdLinks && window.VisitManagerCache.teamProdLinks.length > 0) {
            const allowedProdIds = window.VisitManagerCache.teamProdLinks
                .filter(pt => allowedTeamIds.includes(String(pt.Team_ID)) && String(pt.Status || 'Active').toLowerCase() === 'active')
                .map(pt => String(pt.Product_ID));
            allowedProducts = globalProductsList.filter(p => allowedProdIds.includes(String(p.Product_ID)));
        }
        
        if (allowedProducts.length === 0 && allowedTeamIds.length > 0) {
            allowedProducts = globalProductsList.filter(p => allowedTeamIds.includes(String(p.Team_ID || p.team_id)));
        }

        if (allowedProducts.length === 0) {

            plugins: ['remove_button'], 
            create: false, 
            sortField: { field: "text", direction: "asc" }, 
            placeholder: prodPlaceholder, 
            dropdownParent: 'body' 
        });
    }
  }

  function handleFilterChange(source) {
    const repSelect = document.getElementById('filterVisitRep');
    const terSelect = document.getElementById('filterVisitTerritory');
    if (!repSelect || !terSelect) return;

    const repVal = repSelect.value;
    const terVal = terSelect.value;

    if (source === 'rep') {
        let validTers = window.fullAllowedTerritories || [];
        if (repVal !== "") {
            const selectedRep = (window.fullAllowedUsers || []).find(u => String(u.Rep_ID || u.User_ID || u.id) === repVal);
            if (selectedRep) {
                const rTeam = String(selectedRep.Team_ID || selectedRep.Team || '');
                const rTer = String(selectedRep.Territory_ID || selectedRep.Territory || selectedRep.territoryId || '');
                validTers = (window.fullAllowedTerritories || []).filter(t => {
                    const tId = String(t.Territory_ID);
                    const tTeam = String(t.Team_ID);
                    return tId === rTer || (rTeam && rTeam !== 'undefined' && tTeam === rTeam) || window.myIsGlobalViewer;
                });
                if (validTers.length === 0) validTers = window.fullAllowedTerritories;
            }
        }
        
        const currentTerVal = terSelect.value;
        let tHtml = `<option value="">${safeTranslate('opt_all_territories', '- ทั้งหมด -')}</option>`;
        validTers.forEach(t => tHtml += `<option value="${t.Territory_ID}">${t.Territory}</option>`);
        terSelect.innerHTML = tHtml;
        
        if (validTers.some(t => String(t.Territory_ID) === currentTerVal)) {
            terSelect.value = currentTerVal;
        } else {
            terSelect.value = "";
        }
    }

    if (source === 'territory') {
        let validReps = window.fullAllowedUsers || [];
        if (terVal !== "") {
            const selectedTer = (window.fullAllowedTerritories || []).find(t => String(t.Territory_ID) === terVal);
            if (selectedTer) {
                const tTeam = String(selectedTer.Team_ID || '');
                validReps = (window.fullAllowedUsers || []).filter(u => {
                    const uTeam = String(u.Team_ID || u.Team || '');
                    const uTer = String(u.Territory_ID || u.Territory || u.territoryId || '');
                    return uTer === terVal || (tTeam && tTeam !== 'undefined' && uTeam === tTeam) || window.myIsGlobalViewer;
                });
                if (validReps.length === 0) validReps = window.fullAllowedUsers;
            }
        }
        
        const currentRepVal = repSelect.value;
        let repHtml = `<option value="">${safeTranslate('opt_all_users', '- ทั้งหมด -')}</option>`;
        const uniqueUsersMap = new Map();
        validReps.forEach(u => { const id = String(u.Rep_ID || u.User_ID || u.id); if(id && id !== 'undefined') uniqueUsersMap.set(id, u); });
        uniqueUsersMap.forEach((u, id) => { repHtml += `<option value="${id}">${u.Rep_Name || u.Name || u.Email}</option>`; });
        
        repSelect.innerHTML = repHtml;
        
        if (validReps.some(r => String(r.Rep_ID || r.User_ID || r.id) === currentRepVal)) {
            repSelect.value = currentRepVal;
        } else {
            repSelect.value = "";
        }
    }

    filterVisits();
  }

  function sortVisits(col) {
    if (currentSortCol === col) {
      currentSortAsc = !currentSortAsc; 
    } else {
      currentSortCol = col;
      currentSortAsc = true; 
    }

    ['date', 'doctor', 'hospital', 'products', 'purpose', 'status'].forEach(c => {
      const icon = document.getElementById('icon-sort-' + c);
      if (icon) {
        if (c === currentSortCol) {
          icon.className = currentSortAsc ? 'fa-solid fa-sort-up text-primary ms-1' : 'fa-solid fa-sort-down text-primary ms-1';
        } else {
          icon.className = 'fa-solid fa-sort text-muted ms-1';
        }
      }
    });

    filterVisits(false); 
  }

  async function loadVisits(forceReload = false) {
    const tbody = document.getElementById('visitTableBody');
    window.VisitManagerCache = window.VisitManagerCache || {};

    if (forceReload || !window.VisitManagerCache.isLoaded) {
        if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5">Loading data (Bypassing limit)... <i class="fa-solid fa-spinner fa-spin text-primary"></i></td></tr>`;

        try {
          const [visitRes, vpRes, dcrRes] = await Promise.all([
            fetchAllRecords('Visit_Logs'),
            fetchAllRecords('Visit_Products'),
            supabaseClient.from('DCR').select('Ref_ID').eq('Action', 'Unlock Visit').eq('Status', 'Pending')
          ]);

          window.VisitManagerCache.visits = visitRes || [];
          window.VisitManagerCache.visitProducts = vpRes || []; 
          window.VisitManagerCache.pendingUnlocks = (dcrRes.data || []).map(d => d.Ref_ID);
          window.VisitManagerCache.isLoaded = true;

        } catch(err) { 
          if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">❌ Failed to load data: ${err.message}</td></tr>`; 
          return;
        }
    }

    globalVisits = window.VisitManagerCache.visits;
    globalVisitProducts = window.VisitManagerCache.visitProducts;
    globalPendingUnlockVisits = window.VisitManagerCache.pendingUnlocks;

    if (window.VisitManagerCache.filters) {
        const f = window.VisitManagerCache.filters;
        
        if (document.getElementById('smartSearchInput')) document.getElementById('smartSearchInput').value = f.smartSearch || '';
        if (document.getElementById('filterStartDate')) document.getElementById('filterStartDate').value = f.startDate || '';
        if (document.getElementById('filterEndDate')) document.getElementById('filterEndDate').value = f.endDate || '';
        if (document.getElementById('filterVisitStatus')) document.getElementById('filterVisitStatus').value = f.status || '';
        if (document.getElementById('filterVisitRep')) document.getElementById('filterVisitRep').value = f.rep || '';
        if (document.getElementById('filterVisitTerritory')) document.getElementById('filterVisitTerritory').value = f.territory || '';
        if (document.getElementById('visitRowsPerPage')) document.getElementById('visitRowsPerPage').value = f.rows || 20;

        currentPage = f.page || 1;
        rowsPerPage = f.rows || 20;
        currentSortCol = f.sortCol || 'date';
        currentSortAsc = f.sortAsc !== undefined ? f.sortAsc : false;
    }

    filterVisits(false);
  }

  function filterVisits(resetPage = true) {
    const repSelect = document.getElementById('filterVisitRep');
    const terSelect = document.getElementById('filterVisitTerritory');
    const repTerm = repSelect ? repSelect.value : '';
    const terTerm = terSelect ? terSelect.value : '';
    
    const smartSearchKey = document.getElementById('smartSearchInput') ? document.getElementById('smartSearchInput').value.trim().toLowerCase() : '';

    const statusTerm = document.getElementById('filterVisitStatus') ? document.getElementById('filterVisitStatus').value : '';
    const startDateTerm = document.getElementById('filterStartDate') ? document.getElementById('filterStartDate').value : '';
    const endDateTerm = document.getElementById('filterEndDate') ? document.getElementById('filterEndDate').value : '';

    if (resetPage) currentPage = 1;

    window.VisitManagerCache.filters = {
        smartSearch: smartSearchKey, startDate: startDateTerm, endDate: endDateTerm,
        status: statusTerm, rep: repTerm, territory: terTerm,
        page: currentPage, rows: rowsPerPage, sortCol: currentSortCol, sortAsc: currentSortAsc
    };

    const searchKeywords = smartSearchKey ? smartSearchKey.split(' ').filter(k => k !== '') : [];

    const filtered = globalVisits.filter(v => {
      let hasSecurityAccess = false;

      if (window.myIsGlobalViewer) {
        hasSecurityAccess = true;
      } else {
        const rawWho = String(v.Whoupdated || v.whoupdated || '').toLowerCase().trim();
        const rawRepId = String(v.Rep_ID || v.rep_id || '').trim();
        const vTerrId = String(v.Territory_ID || v.territory_id || '').trim();

        if (window.myAllowedRepIds.includes(rawRepId) || 
            window.myAllowedTerIds.includes(vTerrId) || 
            window.myAllowedEmails.includes(rawWho) || 
            window.myAllowedNames.includes(rawWho)) {
            hasSecurityAccess = true;
        }
      }

      if (!hasSecurityAccess) return false;

      if (!window.myIsGlobalViewer && !['BU Head', 'BU', 'Manager', 'Sales Manager'].includes(globalCurrentUserRole)) {
          const isDocAssigned = globalAssignedDoctors.some(d => String(d.Doc_ID || d.doc_id || d.id).trim().toLowerCase() === String(v.Doc_ID || v.doc_id || v.id).trim().toLowerCase());
          if (!isDocAssigned) return false; 
      }

      if (searchKeywords.length > 0) {
        const docObj = globalAllDoctors.find(d => String(d.Doc_ID || d.doc_id || d.id || '').trim().toLowerCase() === String(v.Doc_ID || v.doc_id || v.id || '').trim().toLowerCase());
        const docName = docObj ? `${docObj.Doc_Name} ${docObj.Doc_Name_TH || ''}`.toLowerCase() : '';
        
        const hospName = getHospitalNameFromDocOrVisit(docObj, v).toLowerCase();

        const visitProds = globalVisitProducts.filter(vp => String(vp.Visit_ID) === String(v.Visit_ID));
        const prodNames = visitProds.map(vp => {
          const p = globalProductsList.find(px => String(px.Product_ID) === String(vp.Product_ID));
          return p ? p.Product.toLowerCase() : '';
        }).join(' ');

        const rowFullText = `${docName} ${hospName} ${prodNames} ${v.Purpose || ''} ${v.Details || ''}`;

        const matchSmart = searchKeywords.every(key => rowFullText.includes(key));
        if (!matchSmart) return false;
      }

      let matchDate = true;
      if (startDateTerm || endDateTerm) {
          const vDate = new Date(v.Visit_Date);
          vDate.setHours(0, 0, 0, 0); 
          
          if (startDateTerm) {
              const sDate = new Date(startDateTerm);
              sDate.setHours(0, 0, 0, 0);
              if (vDate < sDate) matchDate = false;
          }
          if (endDateTerm) {
              const eDate = new Date(endDateTerm);
              eDate.setHours(23, 59, 59, 999);
              if (vDate > eDate) matchDate = false;
          }
      }

      let matchRep = (repTerm === "");
      if (repTerm !== "") {
          const selUser = (window.fullAllowedUsers || []).find(u => String(u.Rep_ID || u.User_ID || u.id) === repTerm);
          const selId = repTerm;
          const selEm = selUser ? String(selUser.Email).toLowerCase() : '';
          const selNm = selUser ? String(selUser.Rep_Name || selUser.Name).toLowerCase() : '';
          
          const rawWho = String(v.Whoupdated || v.whoupdated || '').toLowerCase().trim();
          const rawRepId = String(v.Rep_ID || v.rep_id || '').trim();

          if (rawRepId === selId || (selEm && rawWho === selEm) || (selNm && rawWho === selNm)) {
              matchRep = true;
          }
      }

      const matchTer = (terTerm === "") ? true : (String(v.Territory_ID || v.territory_id) === String(terTerm));

      const matchStatus = (statusTerm === "") || (v.Status === statusTerm);

      return matchDate && matchRep && matchTer && matchStatus;
    });

    filtered.sort((a, b) => {
      let valA = '', valB = '';

      if (currentSortCol === 'date') {
        valA = a.Visit_Date || ''; valB = b.Visit_Date || '';
      } 
      else if (currentSortCol === 'doctor') {
        const docA = globalAllDoctors.find(d => String(d.Doc_ID || d.doc_id || d.id || '').trim().toLowerCase() === String(a.Doc_ID || a.doc_id || a.id || '').trim().toLowerCase());
        valA = docA ? `${docA.Doc_Name} ${docA.Doc_Name_TH||''}`.toLowerCase() : '';
        const docB = globalAllDoctors.find(d => String(d.Doc_ID || d.doc_id || d.id || '').trim().toLowerCase() === String(b.Doc_ID || b.doc_id || b.id || '').trim().toLowerCase());
        valB = docB ? `${docB.Doc_Name} ${docB.Doc_Name_TH||''}`.toLowerCase() : '';
      } 
      else if (currentSortCol === 'hospital') {
        const docA = globalAllDoctors.find(d => String(d.Doc_ID || d.doc_id || d.id || '').trim().toLowerCase() === String(a.Doc_ID || a.doc_id || a.id || '').trim().toLowerCase());
        valA = getHospitalNameFromDocOrVisit(docA, a).toLowerCase();
        
        const docB = globalAllDoctors.find(d => String(d.Doc_ID || d.doc_id || d.id || '').trim().toLowerCase() === String(b.Doc_ID || b.doc_id || b.id || '').trim().toLowerCase());
        valB = getHospitalNameFromDocOrVisit(docB, b).toLowerCase();
      } 
      else if (currentSortCol === 'products') {
        valA = globalVisitProducts.filter(vp => String(vp.Visit_ID) === String(a.Visit_ID)).map(vp => {
          const p = globalProductsList.find(px => String(px.Product_ID) === String(vp.Product_ID)); return p ? p.Product : '';
        }).join(',').toLowerCase();
        valB = globalVisitProducts.filter(vp => String(vp.Visit_ID) === String(b.Visit_ID)).map(vp => {
          const p = globalProductsList.find(px => String(px.Product_ID) === String(vp.Product_ID)); return p ? p.Product : '';
        }).join(',').toLowerCase();
      } 
      else if (currentSortCol === 'purpose') {
        valA = (a.Purpose || '').toLowerCase(); valB = (b.Purpose || '').toLowerCase();
      } 
      else if (currentSortCol === 'status') {
        valA = (a.Status || '').toLowerCase(); valB = (b.Status || '').toLowerCase();
      }

      if (valA < valB) return currentSortAsc ? -1 : 1;
      if (valA > valB) return currentSortAsc ? 1 : -1;
      return 0;
    });

    globalFilteredVisits = filtered;

    updateStatCards(globalFilteredVisits);

    renderVisitTable();
  }

  function updateStatCards(filteredVisits) {
    const total = filteredVisits.length;
    const pending = filteredVisits.filter(v => v.Status === 'Pending').length;
    const submitted = filteredVisits.filter(v => v.Status === 'Submitted').length;

    if (document.getElementById('statTotalVisits')) document.getElementById('statTotalVisits').innerText = total;
    if (document.getElementById('statPendingVisits')) document.getElementById('statPendingVisits').innerText = pending;
    if (document.getElementById('statSubmittedVisits')) document.getElementById('statSubmittedVisits').innerText = submitted;
  }

  function changeRowsPerPage() {
    const selectEl = document.getElementById('visitRowsPerPage');
    rowsPerPage = parseInt(selectEl.value);
    currentPage = 1;
    window.VisitManagerCache.filters.rows = rowsPerPage;
    window.VisitManagerCache.filters.page = 1;
    renderVisitTable();
  }

  function goToPage(page) {
    const totalPages = Math.ceil(globalFilteredVisits.length / rowsPerPage);
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    window.VisitManagerCache.filters.page = page;
    renderVisitTable();
  }

  function renderVisitTable() {
    const tbody = document.getElementById('visitTableBody');
    if (!tbody) return; 

    tbody.innerHTML = '';
    const data = globalFilteredVisits;

    if (!Array.isArray(data) || data.length === 0) {
        document.getElementById('visitPaginationContainer').classList.add('d-none');
        return tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-5"><i class="fa-solid fa-folder-open fs-3 mb-2 d-block text-muted"></i>No visit records found for the selected period.</td></tr>`;
    }

    document.getElementById('visitPaginationContainer').classList.remove('d-none');

    const totalItems = data.length;
    const totalPages = Math.ceil(totalItems / rowsPerPage);
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIndex = (currentPage - 1) * rowsPerPage;
    const endIndex = Math.min(startIndex + rowsPerPage, totalItems);
    
    document.getElementById('visitPageInfo').innerText = `Showing ${startIndex + 1} to ${endIndex} of ${totalItems} entries`;

    const paginatedData = data.slice(startIndex, endIndex);

    paginatedData.forEach(v => {
      const isPendingUnlock = globalPendingUnlockVisits.includes(v.Visit_ID);
      let badgeClass = (v.Status === 'Submitted') ? 'badge-soft-success' : 'badge-soft-pending';
      let statusShow = (v.Status === 'Submitted') ? '✅ Submitted' : '⏳ Pending';

      if (isPendingUnlock) {
        badgeClass = 'badge-soft-secondary';
        statusShow = '⏳ Pending Unlock';
      }

      const dateShow = v.Visit_Date ? new Date(v.Visit_Date).toLocaleDateString('th-TH') : '-';

      const docObj = globalAllDoctors.find(d => String(d.Doc_ID || d.doc_id || d.id || '').trim().toLowerCase() === String(v.Doc_ID || v.doc_id || v.id || '').trim().toLowerCase());
      let docNameShow = v.Doc_ID || v.doc_id || v.id || '-';

      if (docObj) {
        const hasQuestionMarks = docObj.Doc_Name_TH && docObj.Doc_Name_TH.includes('???');
        const nameThShow = (docObj.Doc_Name_TH && !hasQuestionMarks) ? ` (${docObj.Doc_Name_TH})` : '';
        docNameShow = `${docObj.Doc_Name}${nameThShow}`;
      }

      const hospNameShow = getHospitalNameFromDocOrVisit(docObj, v);

      const visitProds = globalVisitProducts.filter(vp => String(vp.Visit_ID) === String(v.Visit_ID)).map(vp => String(vp.Product_ID));
      let prodBadges = '';
      if (visitProds.length > 0) {
        visitProds.forEach(pid => {
            const pObj = globalProductsList.find(p => String(p.Product_ID) === pid);
            const pName = pObj ? pObj.Product : pid;
            prodBadges += `<span class="badge badge-soft-product me-1 mb-1">${pName}</span>`;
        });
      } else {
        prodBadges = '<span class="text-muted small">-</span>';
      }

      tbody.innerHTML += `
        <tr>
          <td class="text-center fw-bold">
            <a href="#" class="table-visit-link" onclick="openEditVisitView('${v.Visit_ID}'); return false;" title="Click to view details">
              ${dateShow}
            </a>
          </td>
          <td class="fw-bold text-dark">${docNameShow}</td>
          <td class="text-secondary"><small><i class="fa-regular fa-hospital me-1 text-primary"></i>${hospNameShow}</small></td>
          <td>${prodBadges}</td>
          <td><small class="text-secondary">${v.Purpose || '-'}</small></td>
          <td class="text-center"><span class="badge ${badgeClass}">${statusShow}</span></td>
        </tr>
      `;
    });

    renderPaginationControls(totalPages);
  }

  function renderPaginationControls(totalPages) {
    const ul = document.getElementById('visitPagination');
    let html = '';

    html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
              <a class="page-link shadow-sm" href="#" onclick="goToPage(${currentPage - 1}); return false;">&laquo; Prev</a>
            </li>`;

    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, currentPage + 2);

    if (startPage > 1) {
        html += `<li class="page-item"><a class="page-link shadow-sm" href="#" onclick="goToPage(1); return false;">1</a></li>`;
        if (startPage > 2) html += `<li class="page-item disabled"><span class="page-link border-0 text-muted">...</span></li>`;
    }

    for (let i = startPage; i <= endPage; i++) {
        html += `<li class="page-item ${currentPage === i ? 'active' : ''}">
                  <a class="page-link shadow-sm" href="#" onclick="goToPage(${i}); return false;">${i}</a>
                </li>`;
    }

    if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<li class="page-item disabled"><span class="page-link border-0 text-muted">...</span></li>`;
        html += `<li class="page-item"><a class="page-link shadow-sm" href="#" onclick="goToPage(${totalPages}); return false;">${totalPages}</a></li>`;
    }

    html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
              <a class="page-link shadow-sm" href="#" onclick="goToPage(${currentPage + 1}); return false;">Next &raquo;</a>
            </li>`;

    ul.innerHTML = html;
  }

  function toggleVisitFormEditable(isEditable) {
    const fields = ['visitDocId', 'visitProductId', 'visitDate', 'visitStartTime', 'visitEndTime', 'visitPurpose', 'visitDetails', 'visitInsight', 'visitNextAction', 'visitStatus'];
    fields.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.disabled = !isEditable;
        if (el.tomselect) {
          if (isEditable) el.tomselect.enable();
          else el.tomselect.disable();
        }
      }
    });
    ['btnMicDoc', 'btnMicDetails', 'btnMicInsight', 'btnMicNextAction'].forEach(id => {
      const btn = document.getElementById(id);
      if (btn) btn.disabled = !isEditable;
    });
  }

  function openAddVisitView() {
    ['visitDocId', 'visitProductId', 'visitDate', 'visitPurpose'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('is-invalid'); });

    document.getElementById('visitForm').reset();
    document.getElementById('visitId').value = '';
    document.getElementById('formVisitTitle').innerHTML = '📝 <span data-i18n="title_add_visit">Add New Visit</span>';
    document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('visitStatus').value = 'Pending';
    document.getElementById('visitInsight').value = ''; 

    initUserInfo(); 

    if (tomSelectDocInstance) {
      tomSelectDocInstance.clear();
      tomSelectDocInstance.enable(); 
    } else { 
      const docSelect = document.getElementById('visitDocId'); 
      if (docSelect) { docSelect.value = ''; docSelect.disabled = false; }
    }

    renderFormProductDropdown();

    const returnToDocId = sessionStorage.getItem('returnToDocId');
    if (returnToDocId) {
      setTimeout(() => {
        if (tomSelectDocInstance) {
          tomSelectDocInstance.setValue(returnToDocId);
          tomSelectDocInstance.disable(); 
        } else {
          const docSelect = document.getElementById('visitDocId');
          if (docSelect) { 
            docSelect.value = returnToDocId; 
            docSelect.dispatchEvent(new Event('change')); 
            docSelect.disabled = true; 
          }
        }
      }, 200); 
    }

    toggleVisitFormEditable(true);
    if (returnToDocId) {
      setTimeout(() => {
        if (tomSelectDocInstance) tomSelectDocInstance.disable();
        else document.getElementById('visitDocId').disabled = true;
      }, 250);
    }

    const btn = document.getElementById('saveVisitBtn');
    btn.dataset.mode = 'save';
    btn.className = 'btn btn-primary fw-bold px-5 rounded-pill py-2 shadow-sm';
    btn.innerHTML = '💾 <span data-i18n="btn_save">Save</span>';
    btn.disabled = false;

    switchVisitView('visitFormView');
  }

  function openEditVisitView(visitId) {
    ['visitDocId', 'visitProductId', 'visitDate', 'visitPurpose'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('is-invalid'); });

    const v = globalVisits.find(x => x.Visit_ID === visitId);
    if (!v) return;

    document.getElementById('visitId').value = v.Visit_ID;
    document.getElementById('formVisitTitle').innerHTML = '✏️ <span data-i18n="title_edit_visit">Edit Visit</span>';
    
    let repNameShow = v.Rep_ID || '-';
    let targetRepObj = null;
    if (globalUsersList && globalUsersList.length > 0) {
        targetRepObj = globalUsersList.find(u => String(u.Rep_ID || u.User_ID || u.id) === String(v.Rep_ID));
        if (targetRepObj) repNameShow = targetRepObj.Rep_Name || targetRepObj.Name || targetRepObj.Email || repNameShow;
    }
    
    let terNameShow = v.Territory_ID || '-';
    if (globalTerritoryList && globalTerritoryList.length > 0) {
        const terObj = globalTerritoryList.find(t => String(t.Territory_ID) === String(v.Territory_ID));
        if (terObj) terNameShow = terObj.Territory;
        else if (String(terNameShow).length > 20) terNameShow = '-'; 
    }
    
    document.getElementById('dispSalesRepName').innerText = repNameShow;
    document.getElementById('dispTerritoryName').innerText = terNameShow;

    if (tomSelectDocInstance) tomSelectDocInstance.setValue(v.Doc_ID);
    else document.getElementById('visitDocId').value = v.Doc_ID || '';

    renderFormProductDropdown(targetRepObj);
    const visitProds = globalVisitProducts.filter(vp => String(vp.Visit_ID) === String(visitId)).map(vp => String(vp.Product_ID));
    if (tomSelectProdInstance) {
        tomSelectProdInstance.setValue(visitProds);
    }

    document.getElementById('visitDate').value = v.Visit_Date || '';
    document.getElementById('visitStartTime').value = v.Start_Time || '';
    document.getElementById('visitEndTime').value = v.End_Time || '';
    document.getElementById('visitPurpose').value = v.Purpose || '';
    document.getElementById('visitDetails').value = v.Details || '';
    document.getElementById('visitInsight').value = v.Insight || ''; 
    document.getElementById('visitNextAction').value = v.Next_Action || '';
    document.getElementById('visitStatus').value = v.Status || 'Pending';

    const isPendingUnlock = globalPendingUnlockVisits.includes(v.Visit_ID);
    const btn = document.getElementById('saveVisitBtn');

    if (isPendingUnlock) {
      toggleVisitFormEditable(false);
      btn.disabled = true;
      btn.className = 'btn btn-secondary fw-bold px-5 rounded-pill py-2 shadow-sm';
      btn.innerHTML = '<i class="fa-solid fa-clock me-2"></i>Waiting for Admin unlock';
      btn.dataset.mode = 'disabled';
    } else if (v.Status === 'Submitted') {
      toggleVisitFormEditable(false);
      btn.disabled = false;
      btn.className = 'btn btn-warning text-dark fw-bold px-5 rounded-pill py-2 shadow-sm';
      btn.innerHTML = '<i class="fa-solid fa-unlock-keyhole me-2"></i>Request Unlock';
      btn.dataset.mode = 'request_unlock';
    } else {
      toggleVisitFormEditable(true);
      btn.disabled = false;
      btn.className = 'btn btn-primary fw-bold px-5 rounded-pill py-2 shadow-sm';
      btn.innerHTML = '💾 <span data-i18n="btn_save">Save</span>';
      btn.dataset.mode = 'save';
      
      if (sessionStorage.getItem('returnToDocId')) {
         if (tomSelectDocInstance) tomSelectDocInstance.disable();
         else document.getElementById('visitDocId').disabled = true;
      }
    }

    switchVisitView('visitFormView');
  }

  async function requestUnlockVisit(visitId) {
    const btn = document.getElementById('saveVisitBtn');
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i>Submitting request...`;

    let crmUser = null; 
    try { crmUser = JSON.parse(sessionStorage.getItem('crmUser')); } catch(err) {}
    const whoUpdated = crmUser ? (crmUser.Email || crmUser.Rep_Name || "User") : "Unknown";

    const payload = {
      Action: 'Unlock Visit',
      Ref_ID: visitId,
      Requested_Data: JSON.stringify({ Status: 'Pending' }),
      Status: 'Pending',
      Whoupdated: whoUpdated
    };

    try {
      const { error } = await supabaseClient.from('DCR').insert([payload]);
      if (error) throw error;
      alert("✅ Unlock request (DCR) submitted successfully. Waiting for Admin approval.");
      
      const returnDocId = sessionStorage.getItem('returnToDocId');
      if (returnDocId) {
        sessionStorage.removeItem('returnToDocId');
        returnToDoctorProfile(returnDocId); 
      } else {
        switchVisitView('visitListView');
        await loadVisits(true); 
      }
    } catch(err) {
      alert("❌ Error: " + err.message);
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-unlock-keyhole me-2"></i>Request Unlock';
    }
  }

  function generateUUID() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
  }

  async function handleSaveVisit(e) {
    e.preventDefault();
    const btn = document.getElementById('saveVisitBtn');
    const mode = btn.dataset.mode;

    if (mode === 'disabled') return;
    if (mode === 'request_unlock') {
      requestUnlockVisit(document.getElementById('visitId').value);
      return;
    }

    const docSelect = document.getElementById('visitDocId');
    const dateInput = document.getElementById('visitDate');
    const purposeSelect = document.getElementById('visitPurpose');

    let selectedProducts = [];
    if (tomSelectProdInstance) {
        let val = tomSelectProdInstance.getValue();
        selectedProducts = Array.isArray(val) ? val : (val ? [val] : []);
    } else {
        const prodSelect = document.getElementById('visitProductId');
        selectedProducts = Array.from(prodSelect.selectedOptions).map(o => o.value);
    }
    selectedProducts = selectedProducts.filter(p => p.trim() !== "");

    ['visitDocId', 'visitProductId', 'visitDate', 'visitPurpose'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('is-invalid'); });

    let missingFields = [];
    if (!docSelect.value) { docSelect.classList.add('is-invalid'); missingFields.push("• Doctor"); }
    if (selectedProducts.length === 0) { const pEl = document.getElementById('visitProductId'); if(pEl) pEl.classList.add('is-invalid'); missingFields.push("• Products"); }
    if (!dateInput.value) { dateInput.classList.add('is-invalid'); missingFields.push("• Date"); }
    if (!purposeSelect.value) { purposeSelect.classList.add('is-invalid'); missingFields.push("• Purpose"); }

    if (missingFields.length > 0) {
      alert("⚠️ Cannot save! Please complete the following required fields:\n\n" + missingFields.join("\n"));
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i>Saving...`;

    let crmUser = null; 
    try { crmUser = JSON.parse(sessionStorage.getItem('crmUser')); } catch(err) {}
    const whoUpdated = crmUser ? (crmUser.Email || crmUser.Rep_Name || "User") : "Unknown";
    const repId = crmUser ? (crmUser.Rep_ID || crmUser.id || null) : null;
    const territoryId = crmUser ? (crmUser.Territory_ID || crmUser.territoryId || null) : null;

    const existingVisitId = document.getElementById('visitId').value;
    const targetVisitId = existingVisitId || generateUUID();
    
    const payload = {
      Visit_ID: targetVisitId,
      Rep_ID: repId,
      Territory_ID: territoryId,
      Doc_ID: docSelect.value,
      Visit_Date: dateInput.value,
      Start_Time: document.getElementById('visitStartTime').value || null,
      End_Time: document.getElementById('visitEndTime').value || null,
      Purpose: purposeSelect.value,
      Details: document.getElementById('visitDetails').value.trim(),
      Insight: document.getElementById('visitInsight').value.trim(), 
      Next_Action: document.getElementById('visitNextAction').value.trim(),
      Status: document.getElementById('visitStatus').value,
      Whoupdated: whoUpdated,
      Whenupdated: new Date().toISOString()
    };

    try {
      if (existingVisitId) {
        const { error: updErr } = await supabaseClient.from('Visit_Logs').update(payload).eq('Visit_ID', existingVisitId);
        if (updErr) throw new Error("Update Visit_Logs error: " + updErr.message);

        const { error: delErr } = await supabaseClient.from('Visit_Products').delete().eq('Visit_ID', existingVisitId);
        if (delErr) throw new Error("Delete old Visit_Products error: " + delErr.message);

      } else {
        const { error: insErr } = await supabaseClient.from('Visit_Logs').insert([payload]);
        if (insErr) throw new Error("Insert Visit_Logs error: " + insErr.message);
      }

      if (selectedProducts.length > 0) {
          const vpPayload = selectedProducts.map(p => ({ Visit_ID: targetVisitId, Product_ID: p, Whoupdated: whoUpdated }));
          const { error: vpErr } = await supabaseClient.from('Visit_Products').insert(vpPayload);
          if (vpErr) throw new Error("Insert Visit_Products error: " + vpErr.message);
      }

      const returnDocId = sessionStorage.getItem('returnToDocId');
      if (returnDocId) {
        sessionStorage.removeItem('returnToDocId');
        returnToDoctorProfile(returnDocId); 
      } else {
        switchVisitView('visitListView');
        await loadVisits(true); 
      }

    } catch(err) {
      console.error("Save Visit Error:", err);
      alert("❌ Failed to save data.\n\nReason: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = "💾 Save";
    }
  }
</script>
