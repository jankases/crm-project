<div id="draftToastContainer"></div>
<div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3 mt-5" style="z-index: 99999;"></div>

<div class="container-fluid p-0" style="max-width: 1200px; margin: 0 auto;">
  
  <!-- ================= 1. หน้ารายการบันทึกเยี่ยม (List & Calendar View) ================= -->
  <div id="visitListView">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h3 class="text-dark fw-bold mb-1 d-flex align-items-center">
          <span class="header-icon-box"><i class="fa-solid fa-calendar-check"></i></span>
          <span data-i18n="visit_title">Visit Logs</span>
        </h3>
        <p class="text-muted small mb-0" data-i18n="visit_subtitle">Doctor visits and daily activity logs</p>
      </div>
      
      <div class="d-flex gap-2 align-items-center">
        <div class="btn-group shadow-xs bg-white p-1 border me-2 premium-radius-lg">
          <button class="btn btn-sm btn-premium-primary px-3 fw-bold" id="btnToggleList" onclick="window.toggleMainView('list')"><i class="fa-solid fa-list me-1"></i> List</button>
          <button class="btn btn-sm btn-light text-secondary premium-radius px-3 fw-bold border-0" id="btnToggleCal" onclick="window.toggleMainView('calendar')"><i class="fa-regular fa-calendar-days me-1"></i> Calendar</button>
        </div>

        <button type="button" class="btn btn-premium-icon" onclick="window.loadVisits(true)" id="btnRefreshVisits" title="Refresh Data">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>

        <button type="button" class="btn btn-premium-secondary" onclick="window.openAddTotModal()">
          <i class="fa-solid fa-umbrella-beach me-1.5"></i>
          <span data-i18n="btn_add_tot">Add TOT</span>
        </button>

        <button type="button" class="btn btn-premium-primary" onclick="window.openAddVisitView()">
          <i class="fa-solid fa-plus me-1.5"></i>
          <span data-i18n="btn_add_visit">Add New Visit</span>
        </button>
      </div>
    </div>

    <!-- Quick Stat Cards -->
    <div class="row g-3 mb-4">
      <div class="col-sm-6 col-md-4">
        <div class="stat-card d-flex align-items-center">
          <div class="stat-icon bg-primary-subtle text-primary me-3"><i class="fa-solid fa-calendar-days fs-5"></i></div>
          <div>
            <div class="text-muted small fw-semibold" data-i18n="kpi_total_visits">Total Visits</div>
            <h4 class="fw-bold mb-0 text-dark" id="statTotalVisits">0</h4>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4">
        <div class="stat-card d-flex align-items-center">
          <div class="stat-icon bg-warning-subtle text-warning me-3"><i class="fa-solid fa-clock-rotate-left fs-5"></i></div>
          <div>
            <div class="text-muted small fw-semibold" data-i18n="kpi_pending_drafts">Pending Drafts</div>
            <h4 class="fw-bold mb-0 text-dark" id="statPendingVisits">0</h4>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-md-4">
        <div class="stat-card d-flex align-items-center">
          <div class="stat-icon bg-success-subtle text-success me-3"><i class="fa-solid fa-circle-check fs-5"></i></div>
          <div>
            <div class="text-muted small fw-semibold" data-i18n="kpi_submitted_logs">Submitted Logs</div>
            <h4 class="fw-bold mb-0 text-dark" id="statSubmittedVisits">0</h4>
          </div>
        </div>
      </div>
    </div>

    <!-- Search & Filter Bar -->
    <div class="card p-3 border-0 shadow-sm visit-card mb-4 visit-filter-group" id="visitFilterZoneGroup">
      <div class="row g-2 align-items-center">
        
        <div class="col-12 col-lg-5">
          <div class="input-group border bg-white shadow-xs overflow-hidden premium-radius-lg">
            <span class="input-group-text bg-transparent border-0 ps-3 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" class="form-control border-0 bg-transparent fs-6 shadow-none pe-1" id="smartSearchInput" data-i18n="opt_smart_search_ph" placeholder="Search Doctor, Hospital or Product..." onkeyup="window.debouncedFilterVisits()">
            <button class="btn btn-link text-decoration-none text-muted border-0 bg-transparent px-3" type="button" id="btnMicSmartSearch" onclick="window.toggleSpeechSearch('smartSearchInput', 'btnMicSmartSearch', 'micSmartSearchIcon')" title="Voice Search">
              <i class="fa-solid fa-microphone" id="micSmartSearchIcon"></i>
            </button>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
          <div class="input-group input-group-sm border px-2 py-1 bg-white premium-radius-lg">
            <input type="date" class="form-control border-0 bg-transparent text-secondary px-1" id="filterStartDate" onchange="window.filterVisits()" style="font-size: 0.85rem;">
            <span class="align-self-center text-muted">-</span>
            <input type="date" class="form-control border-0 bg-transparent text-secondary px-1" id="filterEndDate" onchange="window.filterVisits()" style="font-size: 0.85rem;">
          </div>
        </div>

        <div class="col-6 col-sm-3 col-lg-2">
          <select class="form-select border shadow-none filter-placeholder-text premium-radius-lg" id="filterVisitStatus" onchange="this.classList.toggle('filter-placeholder-text', this.value === ''); window.filterVisits();" style="font-weight: 500; font-size: 0.9rem;">
            <option value="" id="optAllStatus">- All Status -</option>
            <option value="Pending" id="optStatusPending">Pending Drafts</option>
            <option value="Submitted" id="optStatusSubmitted">Submitted Logs</option>
          </select>
        </div>

        <div class="col-6 col-sm-3 col-lg-2 d-flex gap-2 justify-content-end">
          <button class="btn btn-light border w-50 shadow-sm text-secondary premium-radius" type="button" data-bs-toggle="collapse" data-bs-target="#advancedFilters" title="More Filters">
            <i class="fa-solid fa-sliders"></i>
          </button>
          <button class="btn btn-light border w-50 shadow-sm text-secondary premium-radius" type="button" onclick="window.clearVisitFilters()" title="Clear All Filters">
            <i class="fa-solid fa-eraser"></i>
          </button>
        </div>

      </div>

      <!-- Advanced Filters -->
      <div class="collapse mt-3 pt-3 border-top" id="advancedFilters">
        <div class="row g-3">
          <div class="col-sm-12 col-md-6">
            <label class="form-label fw-bold text-secondary small mb-1" data-i18n="filter_user">User / Sales Rep</label>
            <select class="form-select shadow-none" id="filterVisitRep" multiple onchange="window.handleFilterChange('rep')"></select>
          </div>
          <div class="col-sm-12 col-md-6">
            <label class="form-label fw-bold text-secondary small mb-1" id="lblFilterTerritory">Area / Team</label>
            <select class="form-select shadow-none" id="filterVisitTerritory" multiple onchange="window.handleFilterChange('territory')"></select>
          </div>
        </div>
      </div>
    </div>

    <!-- Zone 1: ตารางประวัติ (List View) -->
    <div id="visitListZone" class="card p-4 border-0 shadow-sm visit-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle border-0" style="font-size: 0.95rem;">
          <thead class="table-custom-header text-center">
            <tr>
              <th class="py-3 sortable-th" onclick="window.sortVisits('date')"><span data-i18n="th_date">Date</span> <i class="fa-solid fa-sort-down text-primary ms-1" id="icon-sort-date"></i></th>
              <th class="py-3 sortable-th" onclick="window.sortVisits('doctor')"><span data-i18n="th_doctor">Doctor</span> <i class="fa-solid fa-sort text-muted ms-1" id="icon-sort-doctor"></i></th>
              <th class="py-3 sortable-th" onclick="window.sortVisits('hospital')"><span data-i18n="th_hospital">Hospital</span> <i class="fa-solid fa-sort text-muted ms-1" id="icon-sort-hospital"></i></th>
              <th class="py-3 sortable-th" onclick="window.sortVisits('products')"><span data-i18n="th_products">Products</span> <i class="fa-solid fa-sort text-muted ms-1" id="icon-sort-products"></i></th>
              <th class="py-3 sortable-th" onclick="window.sortVisits('purpose')"><span data-i18n="th_purpose">Purpose</span> <i class="fa-solid fa-sort text-muted ms-1" id="icon-sort-purpose"></i></th>
              <th class="py-3 sortable-th" onclick="window.sortVisits('status')"><span data-i18n="th_status">Status</span> <i class="fa-solid fa-sort text-muted ms-1" id="icon-sort-status"></i></th>
            </tr>
          </thead>
          <tbody id="visitTableBody">
            <tr><td colspan="6" class="text-center py-5">Loading data... <i class="fa-solid fa-spinner fa-spin text-primary"></i></td></tr>
          </tbody>
        </table>
      </div>

      <!-- Server-Side Pagination Footer Controls -->
      <div id="visitPaginationContainer" class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-3 pt-3 border-top d-none">
        <div class="d-flex align-items-center mb-3 mb-md-0">
          <label class="text-muted small fw-bold me-2 mb-0" data-i18n="lbl_show_rows">Show rows:</label>
          <select class="form-select form-select-sm shadow-sm premium-radius" id="visitRowsPerPage" onchange="window.changeRowsPerPage()" style="width: 80px;">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span class="text-muted small ms-3" id="visitPageInfo">Showing 1 to 20 of 0 entries</span>
        </div>
        <nav aria-label="Page navigation">
          <ul class="pagination pagination-sm custom-pagination mb-0" id="visitPagination"></ul>
        </nav>
      </div>
    </div>

    <!-- Zone 2: มุมมองปฏิทิน (Calendar View) -->
    <div id="visitCalendarZone" class="card p-4 border-0 shadow-sm visit-card d-none">
      <div id="calendar"></div>
    </div>

  </div>

  <!-- ================= 2. หน้าสร้าง/แก้ไขบันทึกเยี่ยม (Form View) ================= -->
  <div id="visitFormView" class="d-none">
    <div class="d-flex align-items-center mb-4">
      <button class="btn btn-premium-secondary me-3" onclick="window.cancelVisitForm()">
        <i class="fa-solid fa-arrow-left me-1"></i> <span data-i18n="btn_back">Back</span>
      </button>
      <h4 class="text-primary fw-bold mb-0" id="formVisitTitle">📝 Visit Details</h4>
    </div>

    <div class="card p-3 p-md-4 border-0 shadow-sm visit-card">
      <form id="visitForm" onsubmit="window.handleSaveVisit(event)" novalidate class="d-flex flex-column">
        <input type="hidden" id="visitId">

        <div class="p-3 rounded-4 mb-4 border bg-light shadow-xs">
          <div class="row align-items-center">
            <div class="col-md-6 mb-2 mb-md-0">
              <span class="text-muted small fw-bold d-block"><i class="fa-solid fa-user-tie me-1"></i><span data-i18n="lbl_user">User</span></span>
              <span class="fw-bold text-dark fs-6" id="dispSalesRepName">-</span>
            </div>
            <div class="col-md-6">
              <span class="text-muted small fw-bold d-block"><i class="fa-solid fa-map-location-dot me-1"></i><span id="dynamicTerritoryLabel">Territory</span></span>
              <span class="fw-bold text-dark fs-6" id="dispTerritoryName">-</span>
            </div>
          </div>
        </div>

        <div class="row g-4 align-items-stretch">
          <div class="col-12 col-xl-6 d-flex">
            <div class="p-3 p-md-4 rounded-4 border bg-white shadow-xs w-100 d-flex flex-column justify-content-between">
              <div>
                <h5 class="fw-bold text-primary mb-3 border-bottom pb-2"><i class="fa-solid fa-stethoscope me-2"></i><span data-i18n="sec_visit_info">Visit Information</span></h5>
                
                <div class="mb-3">
                  <label class="form-label fw-bold text-dark"><span data-i18n="lbl_doctor">Doctor Name</span> <span class="text-danger">*</span></label>
                  <div class="input-group shadow-sm" style="border-radius: 12px;">
                    <select class="form-select bg-white" id="visitDocId" required></select>
                    <button class="btn btn-outline-danger bg-white border-start-0 px-3" type="button" id="btnMicDoc" onclick="window.toggleDocDictation()" title="Voice Search">
                      <i class="fa-solid fa-microphone fs-6" id="micDocIcon"></i>
                    </button>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold text-dark"><span data-i18n="lbl_products">Products</span> <span class="text-danger">*</span></label>
                  <select class="form-select bg-white shadow-sm premium-radius" id="visitProductId" multiple required></select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold text-dark"><span data-i18n="lbl_purpose">Purpose</span> <span class="text-danger">*</span></label>
                  <select class="form-select bg-white shadow-sm premium-radius" id="visitPurpose" required></select>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold text-dark"><span data-i18n="lbl_date">Date</span> <span class="text-danger">*</span></label>
                  <input type="date" class="form-control bg-white shadow-sm premium-radius" id="visitDate" required>
                </div>

                <div class="row g-2 mb-2">
                  <div class="col-6">
                    <label class="form-label fw-bold text-dark mb-1" data-i18n="lbl_start_time">Start Time</label>
                    <input type="time" class="form-control bg-white shadow-sm premium-radius" id="visitStartTime">
                  </div>
                  <div class="col-6">
                    <label class="form-label fw-bold text-dark mb-1" data-i18n="lbl_end_time">End Time</label>
                    <input type="time" class="form-control bg-white shadow-sm premium-radius" id="visitEndTime">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-xl-6 d-flex">
            <div class="p-3 p-md-4 rounded-4 border bg-white shadow-xs w-100 d-flex flex-column justify-content-between">
              <div class="d-flex flex-column flex-grow-1">
                <h5 class="fw-bold text-primary mb-3 border-bottom pb-2"><i class="fa-solid fa-list-check me-2"></i><span data-i18n="sec_activity_details">Activity Details</span></h5>

                <div class="mb-3 d-flex flex-column flex-grow-1">
                  <label class="form-label fw-bold text-dark mb-1" data-i18n="lbl_details">Details</label>
                  <textarea class="form-control bg-white shadow-sm flex-grow-1 premium-radius" id="visitDetails" style="min-height: 120px; resize: none;"></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold text-dark mb-1" data-i18n="lbl_insight">Insight</label>
                  <textarea class="form-control bg-white shadow-sm premium-radius" id="visitInsight" rows="2" style="resize: none;"></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold text-dark mb-1" data-i18n="lbl_next_action">Next Action</label>
                  <input type="text" class="form-control bg-white shadow-sm premium-radius" id="visitNextAction">
                </div>
              </div>

              <div class="mb-0 pt-3 border-top mt-auto">
                <label class="form-label fw-bold text-dark mb-1" data-i18n="lbl_status">Status</label>
                <select class="form-select bg-white shadow-sm border-primary fw-bold premium-radius-lg" id="visitStatus">
                  <option value="Pending" id="formOptPending" class="text-warning">⏳ Pending (Draft)</option>
                  <option value="Submitted" id="formOptSubmitted" class="text-success">✅ Submitted</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="text-end border-top pt-4 mt-4 d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-premium-secondary" onclick="window.cancelVisitForm()" data-i18n="btn_cancel">Cancel</button>
          <button type="submit" class="btn btn-premium-primary" id="saveVisitBtn" data-mode="save">💾 <span data-i18n="btn_save">Save</span></button>
        </div>
      </form>
    </div>
  </div>

</div>

<!-- โหลด Controller แยกต่างหาก -->
<script src="assets/js/controllers/visitCtrl.js"></script>
