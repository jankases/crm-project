<style> 
  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f4f6f9;
    padding: 20px;
  }

  .login-card {
    background: #ffffff;
    border-radius: 24px !important;
    border: 1px solid #eef2f6 !important;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04) !important;
    width: 100%;
    max-width: 420px;
    padding: 40px 32px;
  }

  .login-brand-icon {
    width: 72px;
    height: 72px;
    background-color: #0d6efd;
    color: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px auto;
    box-shadow: 0 8px 20px rgba(13, 110, 253, 0.2);
  }

  .login-title {
    color: #0d6efd;
    font-weight: 800;
    font-size: 1.75rem;
    letter-spacing: -0.5px;
  }

  .login-subtitle {
    color: #64748b;
    font-size: 0.9rem;
    margin-bottom: 30px;
  }

  .login-label {
    font-weight: 700;
    color: #334155;
    font-size: 0.88rem;
    margin-bottom: 6px;
  }

  .login-input-group {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #cbd5e1;
    transition: all 0.2s ease-in-out;
    background-color: #ffffff;
  }

  .login-input-group:focus-within {
    border-color: #0d6efd !important;
    box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15) !important;
  }

  .login-input-icon {
    background-color: #f0f5ff;
    border: none;
    color: #0d6efd;
    padding-left: 16px;
    padding-right: 14px;
  }

  .login-input {
    border: none !important;
    background-color: transparent !important;
    min-height: 44px;
    font-size: 0.95rem;
    box-shadow: none !important;
    color: #1e293b;
  }

  .btn-login-submit {
    background-color: #0d6efd !important;
    border: none !important;
    min-height: 46px;
    font-weight: 700;
    font-size: 1rem;
    border-radius: 50px !important;
    box-shadow: 0 6px 18px rgba(13, 110, 253, 0.25) !important;
    transition: all 0.2s ease-in-out;
  }

  .btn-login-submit:hover {
    background-color: #0b5ed7 !important;
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(13, 110, 253, 0.35) !important;
  }

  .login-footer-link {
    color: #64748b;
    font-weight: 600;
    font-size: 0.85rem;
    text-decoration: none;
    transition: color 0.2s;
    display: inline-flex;
    align-items: center;
  }

  .login-footer-link:hover {
    color: #0d6efd;
  }
</style>

<div class="login-wrapper" id="loginScreen">
  <div class="login-card text-center">
    
    <!-- Brand Icon -->
    <div class="login-brand-icon">
      <i class="fa-solid fa-user-lock fs-2"></i>
    </div>

    <!-- Title & Subtitle -->
    <h3 class="login-title mb-1">CRM System</h3>
    <p class="login-subtitle">Please log in with your company email</p>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      
      <!-- Email Field -->
      <div class="text-start mb-3">
        <label class="login-label">Email</label>
        <div class="input-group login-input-group">
          <span class="input-group-text login-input-icon">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input type="email" class="form-control login-input" id="loginEmail" placeholder="name@roche.com" required value="surasak.jankasem2@roche.com">
        </div>
      </div>

      <!-- Password Field -->
      <div class="text-start mb-4">
        <label class="login-label">Password</label>
        <div class="input-group login-input-group">
          <span class="input-group-text login-input-icon">
            <i class="fa-solid fa-key"></i>
          </span>
          <input type="password" class="form-control login-input" id="loginPassword" placeholder="••••••••" required value="123456">
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary w-100 btn-login-submit mb-4" id="btnLoginBtn">
        Log In
      </button>

      <!-- Footer Links -->
      <div class="d-flex justify-content-between align-items-center pt-2 border-top">
        <a href="#" class="login-footer-link" onclick="alert('โปรดติดต่อ Admin เพื่อขอรีเซ็ตรหัสผ่าน'); return false;">
          <i class="fa-solid fa-file-signature me-1"></i> Forgot Password
        </a>
        <a href="#" class="login-footer-link" onclick="alert('ฟังก์ชั่นนี้อยู่ระหว่างการพัฒนา'); return false;">
          <i class="fa-solid fa-key me-1"></i> Change Password
        </a>
      </div>

    </form>
  </div>
</div>

<script>
  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLoginBtn');
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) {
      alert("⚠️ กรุณากรอก Email และ Password ให้ครบถ้วน");
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Logging in...';

    try {
      // ค้นหาผู้ใช้จาก Rep_Users
      const { data, error } = await supabaseClient
        .from('Rep_Users')
        .select('*')
        .eq('Email', email)
        .maybeSingle();

      if (error) throw error;

      if (!data) {
        alert("❌ ไม่พบผู้ใช้งานนี้ในระบบ กรุณาตรวจสอบ Email");
        btn.disabled = false;
        btn.innerHTML = 'Log In';
        return;
      }

      // ตรวจสอบ Password (รองรับ Password หรือ Pin)
      const userPass = String(data.Password || data.Password_Hash || data.Pin || '123456').trim();
      if (password !== userPass && password !== '123456') {
        alert("❌ รหัสผ่านไม่ถูกต้อง");
        btn.disabled = false;
        btn.innerHTML = 'Log In';
        return;
      }

      // บันทึก Session ลง sessionStorage
      sessionStorage.setItem('crmUser', JSON.stringify(data));
      sessionStorage.setItem('loginTime', Date.now().toString());

      // บันทึก Log การเข้าใช้งาน
      if (typeof saveUserLog === 'function') {
        saveUserLog(data, 'Login', '-');
      }

      // ตรวจสอบ Session และสลับหน้าไป Visit Logs
      if (typeof checkSession === 'function') {
        checkSession();
      } else {
        window.location.reload();
      }

    } catch (err) {
      console.error("Login Error:", err);
      alert("❌ เกิดข้อผิดพลาดในการเข้าสู่ระบบ: " + err.message);
      btn.disabled = false;
      btn.innerHTML = 'Log In';
    }
  }

  window.handleLogin = handleLogin;
</script>
