<div class="container-fluid p-0" style="max-width: 1200px; margin: 0 auto;">
  <!-- ================= 1. หน้ารายชื่อแพทย์ (List View) ================= -->
  <div id="doctorListView">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div class="d-flex align-items-center">
        <span class="header-icon-box"><i class="fa-solid fa-user-doctor"></i></span>
        <div>
          <!-- 🌟 เพิ่ม data-i18n ตรงหัวข้อ -->
          <h3 class="text-dark fw-bold mb-1" data-i18n="doc_title">Doctors Management</h3>
          <p class="text-muted small mb-0" data-i18n="doc_subtitle">Database of Doctors and Workplaces</p>
        </div>
      </div>
      
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-premium-secondary" onclick="window.forceReloadDoctors()" id="btnRefreshDoctors" title="Refresh Data">
          <i class="fa-solid fa-arrows-rotate me-1"></i> <span data-i18n="btn_refresh">Refresh</span>
        </button>
        <button type="button" class="btn btn-premium-primary" onclick="window.openAddDoctorView()">
          <i class="fa-solid fa-plus me-1.5"></i><span data-i18n="btn_add_doctor">Add New Doctor</span>
        </button>
      </div>
    </div>

    <!-- ส่วนค้นหา/ตัวกรองข้อมูล -->
    <div class="card p-3 border-0 shadow-sm visit-card mb-4 doctor-filter-group" id="doctorFilterZoneGroup">
      <div class="row g-2 align-items-center">
        
        <!-- 🌟 เพิ่ม data-i18n สำหรับ Placeholder ช่องค้นหา -->
        <div class="col-12 col-lg-5">
          <div class="input-group border bg-white shadow-xs overflow-hidden premium-radius-lg">
            <span class="input-group-text bg-transparent border-0 ps-3 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" class="form-control border-0 bg-transparent fs-6 shadow-none pe-1" id="smartDocSearchInput" data-i18n="opt_search_doc_hosp_ph" placeholder="Search Doctor Name or Hospital (EN/TH)..." onkeyup="window.debouncedFilterDoctors()">
            <button class="btn btn-link text-decoration-none text-muted border-0 bg-transparent px-3" type="button" id="btnMicDocSearch" onclick="window.toggleSpeechSearch('smartDocSearchInput', 'btnMicDocSearch', 'micDocSearchIcon')" title="Voice Search">
              <i class="fa-solid fa-microphone" id="micDocSearchIcon"></i>
            </button>
          </div>
        </div>

        <div class="col-6 col-sm-4 col-lg-3">
          <select class="form-select border shadow-none premium-radius-lg" id="filterDocSpecialty" onchange="window.filterDoctors()" multiple></select>
        </div>

        <div class="col-6 col-sm-4 col-lg-2">
          <select class="form-select border shadow-none premium-radius-lg" id="filterDocType" onchange="window.filterDoctors()" multiple></select>
        </div>

        <div class="col-12 col-sm-4 col-lg-2 d-flex justify-content-end">
          <button class="btn btn-premium-secondary w-100" type="button" onclick="window.clearDoctorFilters()" title="Clear All Filters">
            <i class="fa-solid fa-eraser me-1"></i> <span data-i18n="btn_clear_filters">Clear Filters</span>
          </button>
        </div>

      </div>
    </div>

    <!-- ตารางแสดงผลรายชื่อแพทย์ -->
    <div class="card p-4 border-0 shadow-sm visit-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle border-0" style="font-size: 0.95rem;">
          <thead class="table-custom-header text-center">
            <tr>
              <th class="py-3 sortable-th" onclick="window.sortDoctors('Doc_Name')"><span data-i18n="th_doc_name_en">Doctor Name (EN)</span> <i class="fa-solid fa-sort-up text-primary ms-1" id="icon-sort-doc-Doc_Name"></i></th>
              <th class="py-3 sortable-th" onclick="window.sortDoctors('Doc_Name_TH')"><span data-i18n="th_doc_name_th">Doctor Name (TH)</span> <i class="fa-solid fa-sort text-muted ms-1" id="icon-sort-doc-Doc_Name_TH"></i></th>
              <th class="py-3 sortable-th" onclick="window.sortDoctors('Specialty')"><span data-i18n="th_specialty">Specialty</span> <i class="fa-solid fa-sort text-muted ms-1" id="icon-sort-doc-Specialty"></i></th>
              <th class="py-3 sortable-th" onclick="window.sortDoctors('Hospital_ID')"><span data-i18n="th_primary_hosp">Primary Hospital</span> <i class="fa-solid fa-sort text-muted ms-1" id="icon-sort-doc-Hospital_ID"></i></th>
              <th class="py-3 sortable-th" onclick="window.sortDoctors('Status')"><span data-i18n="th_status">Status</span> <i class="fa-solid fa-sort text-muted ms-1" id="icon-sort-doc-Status"></i></th>
              <th class="py-3" data-i18n="th_action">Action</th>
            </tr>
          </thead>
          <tbody id="doctorTableBody">
            <tr><td colspan="6" class="text-center py-5">
              <div class="d-flex flex-column align-items-center justify-content-center my-4">
                <div class="spinner-border text-primary mb-3" style="width: 2.5rem; height: 2.5rem; border-width: 0.25rem;" role="status"></div>
                <h5 class="text-dark fw-bold mb-1" data-i18n="msg_loading">Loading Data...</h5>
              </div>
            </td></tr>
          </tbody>
        </table>
      </div>

      <div id="doctorPaginationContainer" class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-3 pt-3 border-top d-none">
        <div class="d-flex align-items-center mb-3 mb-md-0">
          <label class="text-muted small fw-bold me-2 mb-0" data-i18n="lbl_show_rows">Show rows:</label>
          <select class="form-select form-select-sm shadow-sm premium-radius" id="doctorRowsPerPage" onchange="window.changeRowsPerPage()" style="width: 80px;">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span class="text-muted small ms-3" id="doctorPageInfo">Showing 1 to 10 of 50 entries</span>
        </div>
        <nav aria-label="Page navigation">
          <ul class="pagination pagination-sm custom-pagination mb-0" id="doctorPagination"></ul>
        </nav>
      </div>

    </div>
  </div>
</div>
