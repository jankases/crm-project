<!-- ManageMatrix.html -->
<div class="index-module-wrapper h-100 d-flex flex-column overflow-hidden">

  <!-- 📌 1. Header Bar -->
  <div class="d-flex justify-content-between align-items-center flex-shrink-0 mt-1 mb-2">
    <div class="d-flex align-items-center gap-2">
      <div class="bg-primary-subtle text-primary rounded-3 d-flex align-items-center justify-content-center shadow-xs" style="width: 30px; height: 30px;">
        <i class="fa-solid fa-table-cells-large" style="font-size: 0.9rem;"></i>
      </div>
      <div class="d-flex align-items-center flex-wrap gap-2">
        <h6 class="text-dark fw-bold mb-0" data-i18n="title_manage_matrix" style="font-size: 1.05rem;">Manage Matrix</h6>
        <i class="fa-solid fa-chevron-right text-muted opacity-50" style="font-size: 0.7rem;"></i> 
        <span class="text-muted fw-medium" data-i18n="desc_manage_matrix" style="font-size: 0.85rem;">Product Rating & Target Allocation</span>
      </div>
    </div>

    <!-- ปุ่ม Action หลัก -->
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-sm btn-premium-primary py-1.5 px-3" onclick="window.openAddMatrixModal()">
        <i class="fa-solid fa-plus me-2"></i><span data-i18n="btn_add_matrix_rule">Add Matrix Rule</span>
      </button>
    </div>
  </div>

  <!-- 📌 2. Main Module Card Container -->
  <div class="sys-card-container flex-grow-1 d-flex flex-column overflow-hidden">
    
    <!-- 🔹 Toolbars & Product Selector Zone -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 pb-2 border-bottom gap-2 flex-shrink-0">
      <div class="d-flex align-items-center gap-2 flex-grow-1" style="max-width: 450px;">
        <label class="form-label text-secondary fw-bold small mb-0 text-nowrap" data-i18n="lbl_select_product">Select Product:</label>
        <select id="matrixProductSelect" class="form-select form-select-sm shadow-xs border-primary fw-bold text-primary" onchange="window.onMatrixProductChange(this.value)" style="height: 36px; border-radius: 8px; cursor: pointer;">
          <option value="">-- Loading Products... --</option>
        </select>
      </div>

      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-primary-subtle text-primary fw-bold px-3 py-2 rounded-pill shadow-xs d-inline-flex align-items-center" style="font-size: 0.88rem;">
          <i class="fa-solid fa-bullseye me-1.5"></i>
          <span data-i18n="lbl_target_freq_prefix">Target Frequency:</span> 
          <span id="matrixTargetFreqText" class="ms-1 text-decoration-underline">Per Cycle</span>
        </span>
      </div>
    </div>

    <!-- 🔹 Dynamic Matrix Workspace -->
    <div class="flex-grow-1 p-1 overflow-hidden" id="matrixMainWorkspace">
      
      <!-- State 1: Empty State -->
      <div class="d-flex flex-column align-items-center justify-content-center h-100 py-5 text-center" id="matrixEmptyState">
        <div class="bg-light-subtle rounded-circle p-4 mb-3 d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
          <i class="fa-solid fa-layer-group fs-1 text-muted opacity-50"></i>
        </div>
        <h6 class="fw-bold text-dark mb-1" data-i18n="msg_matrix_empty_title">No Product Selected</h6>
        <p class="text-muted small mb-0" style="max-width: 360px;" data-i18n="msg_matrix_empty_desc">Please select a product from the dropdown above to manage its classification grid and call targets.</p>
      </div>

      <!-- State 2: 2-Pane Layout (Grid & Targets) -->
      <div id="matrixActiveContent" class="d-none h-100">
        <div class="row g-3 h-100">
          
          <!-- 🌟 ฝั่งซ้าย: แผนผัง Matrix Grid (แบ่ง 8 คอลัมน์) -->
          <div class="col-xl-8 col-lg-7 d-flex flex-column h-100">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h6 class="fw-bold text-primary mb-0">
                <i class="fa-solid fa-border-all me-2"></i><span data-i18n="sec_matrix_grid_title">1. Customer Rating Matrix (Grid View)</span>
              </h6>
            </div>
            <!-- ตารางจะกางเต็มพื้นที่ตรงนี้ -->
            <div id="matrixGridCanvas" class="flex-grow-1 overflow-x-auto sys-card-container p-0 border"></div>
          </div>

          <!-- 🌟 ฝั่งขวา: ตั้งค่า Target Call (แบ่ง 4 คอลัมน์) -->
          <div class="col-xl-4 col-lg-5 d-flex flex-column h-100">
            <div class="sys-card-container h-100 p-3 d-flex flex-column bg-light-subtle">
              <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom flex-shrink-0">
                <h6 class="fw-bold text-success mb-0" style="font-size: 0.95rem;">
                  <i class="fa-solid fa-bullseye me-2"></i><span data-i18n="sec_target_call_title">2. Target Allocation</span>
                </h6>
                <button type="button" class="btn btn-sm btn-success fw-bold px-3 shadow-xs rounded-pill" onclick="window.saveMatrixTargetCalls()">
                  <i class="fa-solid fa-floppy-disk me-2"></i><span data-i18n="btn_save_targets">Save</span>
                </button>
              </div>
              
              <!-- ช่องกรอกเป้าหมาย เรียงแนวตั้ง -->
              <div class="row g-2 align-content-start overflow-y-auto custom-scrollbar flex-grow-1" id="matrixTargetInputsContainer">
                <!-- JS จะสร้างช่องกรอก Target ของแต่ละ Class ตรงนี้ -->
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- ================= 3. POPUP MODAL (ADD / EDIT MATRIX RULE) ================= -->
  <div class="modal fade" id="matrixRuleModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg sys-card-container">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-primary" id="matrixFormTitle">
            <i class="fa-solid fa-pen-to-square me-2"></i><span data-i18n="title_add_matrix_rule">Edit Matrix Rule</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="window.handleSaveMatrix(event)">
          <div class="modal-body p-4">
            
            <div class="mb-3">
              <label class="form-label fw-bold text-secondary small" data-i18n="lbl_product">Product</label>
              <select class="form-select bg-light text-muted fw-bold shadow-none" id="matrixProduct" required style="border-radius: 8px;" disabled></select>
            </div>
            
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label fw-bold text-secondary small" data-i18n="lbl_adoption_axis">Adoption (Y-Axis)</label>
                <select class="form-select shadow-xs" id="matrixAdopt" required style="border-radius: 8px;"></select>
              </div>
              <div class="col-6">
                <label class="form-label fw-bold text-secondary small" data-i18n="lbl_potential_axis">Potential (X-Axis)</label>
                <select class="form-select shadow-xs" id="matrixPot" required style="border-radius: 8px;"></select>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label fw-bold text-primary small" data-i18n="lbl_result_classification">Result = Classification</label>
              <select class="form-select border-primary fw-bold text-primary shadow-xs" id="matrixClass" required style="border-radius: 8px;"></select>
            </div>

          </div>
          <div class="modal-footer border-0 pt-0 d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light fw-bold rounded-pill px-4 border shadow-xs" data-bs-dismiss="modal" data-i18n="btn_cancel">Cancel</button>
            <button type="submit" class="btn btn-primary fw-bold rounded-pill px-4 shadow-xs" id="submitMatrixBtn">
              <i class="fa-solid fa-floppy-disk me-2"></i><span data-i18n="btn_save_rule">Save Rule</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>
