<div id="loginScreen" class="login-wrapper">
  <div class="login-card">
    
    <!-- โลโก้แอป -->
    <div class="login-brand-icon">
      <i class="fa-solid fa-briefcase-medical fa-2x"></i>
    </div>
    
    <!-- ข้อความต้อนรับ -->
    <div class="text-center">
      <h2 class="login-title">CRM System</h2>
      <p class="login-subtitle">Please enter your details to sign in</p>
    </div>

    <!-- แบนเนอร์แจ้งเตือน (เช่น หมดเวลา Session) -->
    <div id="loginAlertBanner"></div>

    <!-- ฟอร์มเข้าสู่ระบบ -->
    <form onsubmit="handleLogin(event)">
      
      <label class="login-label" for="loginEmail">Email Address</label>
      <div class="login-input-group input-group mb-3 d-flex align-items-center">
        <div class="login-input-icon"><i class="fa-solid fa-envelope"></i></div>
        <input type="email" id="loginEmail" class="form-control login-input" placeholder="name@company.com" required>
      </div>

      <label class="login-label" for="loginPassword">Password</label>
      <div class="login-input-group input-group mb-4 d-flex align-items-center">
        <div class="login-input-icon"><i class="fa-solid fa-lock"></i></div>
        <input type="password" id="loginPassword" class="form-control login-input" placeholder="Enter your password" required>
      </div>

      <button type="submit" id="btnLoginBtn" class="btn btn-login-submit w-100 text-white">
        Log In
      </button>
      
    </form>
    
  </div>
</div>

<!-- 🌟 ส่วนสคริปต์ที่ประมวลผลการ Login -->
<script>
  async function handleLogin(e) {
    e.preventDefault();
    e.stopPropagation();
    
    const btn = document.getElementById('btnLoginBtn');
    const emailInput = document.getElementById('loginEmail');
    const passInput = document.getElementById('loginPassword');

    if (!emailInput || !passInput) return;

    const email = emailInput.value.trim().toLowerCase();
    const password = passInput.value.trim();

    if (!email || !password) {
      alert("⚠️ กรุณากรอก Email และ Password ให้ครบถ้วน");
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Logging in...';

    const sb = window.supabaseClient || window.supabase || (typeof supabase !== 'undefined' ? supabase : null);

    if (!sb) {
      alert("❌ ไม่พบการเชื่อมต่อฐานข้อมูล Supabase (กรุณาเช็ก config.js)");
      btn.disabled = false;
      btn.innerHTML = 'Log In';
      return;
    }

    try {
      // 🌟 1. เข้าสู่ระบบด้วย Supabase Auth (ยืนยันตัวตนระดับ Enterprise)
      const { data: authData, error: authError } = await sb.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (authError) {
        throw new Error("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
      }

      const authUserId = authData.user.id; // ได้ UUID มาจากระบบ Supabase Auth

      // 🌟 2. ดึงข้อมูล Profile & Role จากตาราง Rep_Users โดยใช้ Rep_ID = authUserId
      const { data: profile, error: profileError } = await sb
        .from('Rep_Users')
        .select('*')
        .eq('Rep_ID', authUserId)
        .eq('Status', 'Active')
        .maybeSingle();

      if (profileError) throw profileError;

      if (!profile) {
        alert("❌ ไม่พบข้อมูลโปรไฟล์ผู้ใช้งาน หรือบัญชีถูกระงับการใช้งาน");
        btn.disabled = false;
        btn.innerHTML = 'Log In';
        return;
      }

      // 3. เคลียร์ Cache เดิมของระบบก่อนป้องกันข้อมูลสับสน
      sessionStorage.clear();
      if (window.DocManagerCache) window.DocManagerCache.isLoaded = false;
      if (window.VisitManagerCache) window.VisitManagerCache.isLoaded = false;
      if (window.HospManagerCache) window.HospManagerCache.isLoaded = false;

      // 4. บันทึก Session หลัก (ใช้ข้อมูล profile จาก Rep_Users)
      sessionStorage.setItem('crmUser', JSON.stringify(profile));
      sessionStorage.setItem('loginTime', Date.now().toString());

      // 5. บันทึก Permission State รายฟิลด์เพื่อนำไปใช้ข้ามหน้า
      const roleUpper = String(profile.Role || '').trim().toUpperCase();
      sessionStorage.setItem('userRole', roleUpper);
      if (profile.BU_ID) sessionStorage.setItem('userBuId', profile.BU_ID);
      if (profile.Team_ID) sessionStorage.setItem('userTeamId', profile.Team_ID);
      if (profile.Territory_ID) sessionStorage.setItem('userTerritoryId', profile.Territory_ID);

      // 6. ดึงข้อมูลพิเศษสำหรับ Product Manager (PM) จากตาราง Rep_Products
      if (roleUpper.includes('PRODUCT MANAGER') || roleUpper === 'PM') {
        const { data: pmProds, error: pmErr } = await sb
          .from('Rep_Products')
          .select('Product_ID')
          .eq('Rep_ID', profile.Rep_ID)
          .eq('Status', 'Active');

        if (!pmErr && pmProds) {
          const prodIds = pmProds.map(p => p.Product_ID);
          sessionStorage.setItem('pmProducts', JSON.stringify(prodIds));
        }
      }

      // 7. บันทึก Log การเข้าใช้งาน
      if (typeof saveUserLog === 'function') {
        saveUserLog(profile, 'Login', '-');
      }

      // 🌟 8. สลับหน้าจอไปยังระบบ (แก้ไขใส่ await ป้องกันโหลดชนกัน)
      if (typeof checkSession === 'function') {
        await checkSession();
      } else if (typeof window.checkSession === 'function') {
        await window.checkSession();
      } else {
        window.location.reload();
      }

    } catch (err) {
      console.error("Login Error:", err);
      alert("❌ เกิดข้อผิดพลาดในการเข้าสู่ระบบ: " + err.message);
      btn.disabled = false;
      btn.innerHTML = 'Log In';
    }
  }

  window.handleLogin = handleLogin;
</script>
