<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
    #appContainer { display: none; } 
    .navbar { border-bottom: 2px solid #e9ecef; }
    #mainContent { margin-top: 20px; }

    /* 🌟 ตกแต่งเมนูทั่วไปแบบแคปซูล */
    .nav-menu-item {
      color: #6c757d; /* สีเทา */
      font-weight: 500;
      padding: 8px 18px !important;
      border-radius: 50px; /* โค้งมนแบบแคปซูล */
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      margin: 0 2px;
    }
    
    /* เอฟเฟกต์ตอนเอาเมาส์ชี้ */
    .nav-menu-item:hover {
      background-color: #f8f9fa;
      color: #0d6efd;
    }

    /* 🌟 เอฟเฟกต์ตอนถูกเลือก (Active) */
    .nav-menu-item.active {
      background-color: #e7f1ff !important; /* พื้นหลังสีฟ้าอ่อน */
      color: #0d6efd !important; /* ตัวอักษรสีฟ้าเข้ม */
      font-weight: 700; /* ตัวหนาขึ้น */
      box-shadow: 0 2px 5px rgba(13, 110, 253, 0.1);
    }
    
    /* ปรับสีไอคอนตอน Active ให้เข้ากัน */
    .nav-menu-item.active i {
      color: #0d6efd !important; 
    }
    
    /* ปรับแต่งเมนูของ Admin ไม่ให้ขัดกัน */
    .admin-menu-special.active {
       background-color: #ffe6e6 !important; /* สีแดงอ่อนสำหรับเมนู DCR */
       color: #dc3545 !important;
    }
    .admin-menu-special.active i { color: #dc3545 !important; }
  </style>
</head>
<body>

  <!-- พื้นที่สำหรับดึงหน้า Login มาแปะ -->
  <div id="loginComponent"></div>

  <!-- ระบบแอปพลิเคชันหลัก -->
  <div id="appContainer">
    
    <!-- แถบเมนูด้านบน (Navbar) -->
    <nav class="navbar navbar-expand-xl navbar-light bg-white shadow-sm sticky-top">
      <div class="container-fluid px-4">
        
        <!-- โลโก้ -->
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center" href="#" onclick="loadComponent('dashboard')">
          <div class="bg-primary text-white rounded p-2 me-2 d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
            <i class="fa-solid fa-briefcase-medical"></i>
          </div>
          CRM System
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
          
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center" style="font-size: 0.95rem;">
            
            <!-- 🌟 ใส่คลาส nav-menu-item และ attribute data-page เพื่ออ้างอิงตอนกด -->
            <li class="nav-item"><a class="nav-link nav-menu-item" href="#" data-page="visit" onclick="loadComponent('visit')"><i class="fa-solid fa-calendar-check me-1 text-muted"></i> บันทึกเยี่ยม</a></li>
            <li class="nav-item"><a class="nav-link nav-menu-item" href="#" data-page="doctor" onclick="loadComponent('doctor')"><i class="fa-solid fa-user-doctor me-1 text-muted"></i> แพทย์</a></li>
            <li class="nav-item"><a class="nav-link nav-menu-item" href="#" data-page="hospital" onclick="loadComponent('hospital')"><i class="fa-solid fa-hospital me-1 text-muted"></i> โรงพยาบาล</a></li>
            
            <!-- เมนู All-in-One: โครงสร้างองค์กร (เฉพาะ Admin) -->
            <li class="nav-item ms-2 admin-only" style="display: none;">
              <a class="nav-link nav-menu-item border" href="#" data-page="organization" onclick="loadComponent('organization')">
                <i class="fa-solid fa-sitemap me-1 text-primary"></i> โครงสร้างองค์กร
              </a>
            </li>
            
            <!-- เมนู Matrix รวม Target (เฉพาะ Admin) -->
            <li class="nav-item ms-1 admin-only" style="display: none;">
              <a class="nav-link nav-menu-item" href="#" data-page="matrix" onclick="loadComponent('matrix')">
                <i class="fa-solid fa-border-all me-1 text-muted"></i> Rating Matrix
              </a>
            </li>
            
            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item" href="#" data-page="assignment" onclick="loadComponent('assignment')"><i class="fa-solid fa-link me-1 text-muted"></i> Assignment</a></li>
            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item" href="#" data-page="indexData" onclick="loadComponent('indexData')"><i class="fa-solid fa-list-ul me-1 text-muted"></i> ตั้งค่าตัวเลือก</a></li>
            
            <!-- เมนู DCR แต่งให้เด่นนิดนึง -->
            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item admin-menu-special text-danger" href="#" data-page="dcr" onclick="loadComponent('dcr')"><i class="fa-solid fa-file-signature me-1"></i> อนุมัติข้อมูล (DCR)</a></li>
            
            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item" href="#" data-page="user" onclick="loadComponent('user')"><i class="fa-solid fa-users me-1 text-muted"></i> ผู้ใช้งาน</a></li>
          </ul>

          <!-- ข้อมูล User มุมขวาบน -->
          <div class="d-flex align-items-center border-start ps-3 ms-2">
            <div class="text-end me-3">
              <div class="fw-bold text-dark" id="displayUserName" style="font-size: 0.9rem;">-</div>
              <div class="text-muted" id="displayUserRole" style="font-size: 0.75rem;">-</div>
            </div>
            <button class="btn btn-outline-danger btn-sm fw-bold rounded-pill px-3" onclick="logout()">
              <i class="fa-solid fa-arrow-right-from-bracket me-1"></i> ออกจากระบบ
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- พื้นที่แสดงเนื้อหาของแต่ละหน้า (Dynamic Routing) -->
    <div id="mainContent" class="container-fluid max-width-md" style="max-width: 1200px; padding-bottom: 50px;">
      <div class="text-center py-5 text-muted"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br>กำลังโหลดระบบ...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  
  <script>
    const SUPABASE_URL = 'https://trrfwszgscftnybhhsor.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_SyOGO6gN7DGYmj0ltcvokg_y3WOtZdH'; 
    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 

    window.addEventListener('load', async () => {
      await loadLoginComponent();
      checkSession();
    });

    // โหลดหน้า Login มาแปะ 
    async function loadLoginComponent() {
      try {
        const response = await fetch('Login.html');
        if (!response.ok) throw new Error("ไม่พบไฟล์ Login.html");
        const htmlText = await response.text();
        const container = document.getElementById('loginComponent');
        container.innerHTML = htmlText;
        
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) newScript.src = oldScript.src;
          if (oldScript.innerHTML) newScript.innerHTML = oldScript.innerHTML;
          document.body.appendChild(newScript);
        });
      } catch (error) {
        console.error(error);
        document.getElementById('loginComponent').innerHTML = `<div class="alert alert-danger text-center">❌ โหลดไฟล์ Login.html ล้มเหลว</div>`;
      }
    }

    // 🌟 ระบบ Routing สลับหน้าเว็บ และเปลี่ยนสีเมนู (Highlight)
    async function loadComponent(page) {
      let url = '';
      
      switch(page) {
        case 'dashboard': url = 'Dashboard.html'; break;
        case 'visit': url = 'ManageVisits.html'; break;
        case 'doctor': url = 'ManageDoctors.html'; break;
        case 'hospital': url = 'ManageHospitals.html'; break;
        case 'organization': url = 'ManageOrganization.html'; break; 
        case 'matrix': url = 'ManageMatrix.html'; break; 
        case 'assignment': url = 'ManageAssignment.html'; break;
        case 'indexData': url = 'ManageIndex.html'; break;
        case 'dcr': url = 'ManageDCR.html'; break;
        case 'user': url = 'ManageUsers.html'; break;
        default: 
          page = 'visit'; // บังคับเปลี่ยน page เป็น visit เผื่อไว้
          url = 'ManageVisits.html'; 
      }

      // 🌟 1. ลบ Active ออกจากเมนูทั้งหมดก่อน
      const menuItems = document.querySelectorAll('.nav-menu-item');
      menuItems.forEach(item => item.classList.remove('active'));

      // 🌟 2. หาปุ่มเมนูที่ตรงกับ page ที่กำลังโหลด แล้วสั่งให้มีสถานะ Active
      const targetMenu = document.querySelector(`.nav-menu-item[data-page="${page}"]`);
      if (targetMenu) {
        targetMenu.classList.add('active');
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('ไม่พบไฟล์ ' + url);
        const html = await response.text();
        
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = html;

        // ประมวลผล Script ภายในหน้าที่โหลดมาใหม่
        const scripts = mainContent.querySelectorAll('script');
        scripts.forEach(script => {
          const newScript = document.createElement('script');
          if(script.src) newScript.src = script.src;
          if(script.textContent) newScript.textContent = script.textContent;
          document.body.appendChild(newScript);
        });
        
        // ถ้าย่อเมนูบนมือถือ/iPad อยู่ ให้พับเมนูเก็บเมื่อกดเลือกแล้ว
        const navbarCollapse = document.getElementById('navbarNav');
        if (navbarCollapse && navbarCollapse.classList.contains('show')) {
           const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
           if(bsCollapse) bsCollapse.hide();
        }
        
      } catch (error) {
        console.error('Error loading component:', error);
        document.getElementById('mainContent').innerHTML = `<div class="alert alert-danger m-4 text-center fw-bold">❌ ไม่สามารถโหลดหน้าจอได้ (${url})<br>โปรดตรวจสอบว่าสร้างไฟล์นี้ไว้แล้วหรือยัง</div>`;
      }
    }

    // จัดการสิทธิ์การมองเห็น
    function checkSession() {
      const userStr = sessionStorage.getItem('crmUser');
      const loginScreen = document.getElementById('loginScreen'); 
      const appContainer = document.getElementById('appContainer');

      if (userStr) {
        const user = JSON.parse(userStr);
        
        if (loginScreen) {
          loginScreen.classList.remove('d-flex');
          loginScreen.classList.add('d-none');
        }
        if (appContainer) appContainer.style.display = 'block';
        
        const nameDisplay = document.getElementById('displayUserName');
        const roleDisplay = document.getElementById('displayUserRole');
        const dName = user.Rep_Name || user.rep_name || user.name || user.Email || user.email;
        const uRole = user.Role || user.role || 'User';
        
        if(nameDisplay) nameDisplay.innerText = "👨‍💼 " + dName; 
        if(roleDisplay) roleDisplay.innerText = "⭐ " + uRole;
        
        const adminItems = document.querySelectorAll('.admin-only');
        adminItems.forEach(el => {
          el.style.display = (uRole === 'Admin') ? 'block' : 'none';
        });

        // เมื่อ Login สำเร็จ ให้โหลดหน้าเริ่มต้น
        loadComponent('visit');

      } else {
        if (loginScreen) {
          loginScreen.classList.remove('d-none');
          loginScreen.classList.add('d-flex');
        }
        if (appContainer) appContainer.style.display = 'none';
      }
    }

    async function saveUserLog(user, action, duration = "-") {
      try {
        let repId = user.Rep_ID || user.id;
        if (!repId) repId = null;

        const logData = {
          Action: action,            
          Role: user.Role || user.role || "-",           
          Device: navigator.userAgent, 
          "Session Duration": duration, 
          Whoupdated: user.Email || user.email || "System",
          Whenupdated: new Date().toISOString()
        };

        if (repId) logData.Rep_ID = repId;

        await supabaseClient.from('User_Logs').insert([logData]);
      } catch (err) { 
        console.error("System Log error:", err); 
      }
    }

    function logout() { 
      const userStr = sessionStorage.getItem('crmUser');
      const loginTime = sessionStorage.getItem('loginTime');

      if (userStr) {
        const user = JSON.parse(userStr);
        let sessionDuration = "-";
        if (loginTime) {
          const diffMs = Date.now() - parseInt(loginTime);
          sessionDuration = Math.round(diffMs / 60000) + " mins";
        }
        saveUserLog(user, "Logout", sessionDuration);
      }
      sessionStorage.removeItem('crmUser');
      sessionStorage.removeItem('loginTime'); 
      checkSession();
    }
  </script>
</body>
</html>
