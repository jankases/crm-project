<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ดึง CSS ที่เราแยกไว้มาใช้งาน -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* CSS โครงร่างหลักของหน้า Index เท่านั้น (ส่วนที่เหลือย้ายไป style.css แล้ว) */
    body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
    #appContainer { display: none; } 
    #mainContent { margin-top: 20px; }
  </style>
</head>
<body>

  <div id="loginComponent"></div>

  <div id="appContainer">
    <nav id="mainNavbar" class="navbar navbar-expand-lg sticky-top">
      <div class="container-fluid px-3 px-md-4">
        
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center me-3" href="#" onclick="loadComponent('dashboard')">
          <div class="bg-primary text-white rounded-3 p-2 me-2 d-flex align-items-center justify-content-center shadow-sm" style="width: 36px; height: 32px;">
            <i class="fa-solid fa-briefcase-medical fs-6"></i>
          </div>
          <span class="d-none d-sm-inline fs-5" data-i18n="app_title">CRM System</span>
        </a>
        
        <button class="navbar-toggler border-0 shadow-none bg-light px-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
          
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-center mt-3 mt-lg-0">
            <li class="nav-item"><a class="nav-link nav-menu-item menu-visit" href="#" data-page="visit" onclick="loadComponent('visit')"><i class="fa-solid fa-calendar-check me-2"></i> <span data-i18n="menu_visit">Visit Logs</span></a></li>
            <li class="nav-item"><a class="nav-link nav-menu-item menu-doctor" href="#" data-page="doctor" onclick="loadComponent('doctor')"><i class="fa-solid fa-user-doctor me-2"></i> <span data-i18n="menu_doctor">Doctors</span></a></li>
            <li class="nav-item"><a class="nav-link nav-menu-item menu-hospital" href="#" data-page="hospital" onclick="loadComponent('hospital')"><i class="fa-solid fa-hospital me-2"></i> <span data-i18n="menu_hospital">Hospitals</span></a></li>
            
            <li class="nav-item dropdown admin-only ms-1" style="display: none;">
              <a class="nav-link nav-menu-item dropdown-toggle" href="#" id="adminToolsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fa-solid fa-sliders me-2"></i> <span data-i18n="menu_admin_tools">Admin Tools</span>
              </a>
              <ul class="dropdown-menu admin-dropdown-menu border-0 shadow-lg mt-2" aria-labelledby="adminToolsDropdown">
                <li><a class="dropdown-item d-flex align-items-center" href="#" onclick="loadComponent('organization')"><i class="fa-solid fa-sitemap"></i> <span data-i18n="menu_org">Organization</span></a></li>
                <li><a class="dropdown-item d-flex align-items-center" href="#" onclick="loadComponent('target')"><i class="fa-solid fa-bullseye"></i> <span>Manage Targets</span></a></li>
                <li><a class="dropdown-item d-flex align-items-center" href="#" onclick="loadComponent('matrix')"><i class="fa-solid fa-border-all"></i> <span data-i18n="menu_matrix">Matrix</span></a></li>
                <li><a class="dropdown-item d-flex align-items-center" href="#" onclick="loadComponent('assignment')"><i class="fa-solid fa-link"></i> <span data-i18n="menu_assign">Assignment</span></a></li>
                <li><a class="dropdown-item d-flex align-items-center" href="#" onclick="loadComponent('indexData')"><i class="fa-solid fa-list-ul"></i> <span data-i18n="menu_setting">Settings</span></a></li>
                <li><a class="dropdown-item d-flex align-items-center" href="#" onclick="loadComponent('dcr')"><i class="fa-solid fa-file-signature"></i> <span data-i18n="menu_dcr">DCR Approvals</span></a></li>
                <li><a class="dropdown-item d-flex align-items-center text-primary" href="#" onclick="loadComponent('media')"><i class="fa-solid fa-file-powerpoint text-danger"></i> <span data-i18n="menu_media">Media Management</span></a></li>
                <li><hr class="dropdown-divider opacity-50"></li>
                <li><a class="dropdown-item d-flex align-items-center" href="#" onclick="loadComponent('user')"><i class="fa-solid fa-users"></i> <span data-i18n="menu_user">Users Management</span></a></li>
              </ul>
            </li>
          </ul>

          <div class="d-flex flex-column flex-lg-row align-items-center justify-content-end gap-2 mt-3 mt-lg-0 pt-3 pt-lg-0 border-top border-lg-0">
            
            <div class="btn-group lang-btn-group me-lg-2" role="group">
              <!-- สังเกตว่าเรียกใช้ setLanguage() ได้เหมือนเดิม เพราะเราจะ import เข้ามาด้านล่างครับ -->
              <button type="button" class="btn btn-outline-primary" id="btnLangEN" onclick="setLanguage('en')">EN</button>
              <button type="button" class="btn btn-outline-primary" id="btnLangTH" onclick="setLanguage('th')">TH</button>
            </div>

            <div class="user-profile-pill d-flex align-items-center me-lg-2">
              <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                <i class="fa-solid fa-user small"></i>
              </div>
              <div class="text-start pe-2" style="line-height: 1.2;">
                <div class="fw-bold text-dark small" id="displayUserName">-</div>
                <div class="text-muted" id="displayUserRole" style="font-size: 0.72rem;">-</div>
              </div>
            </div>

            <button class="btn btn-outline-danger btn-sm fw-bold rounded-pill px-3 bg-white shadow-xs" onclick="logout()">
              <i class="fa-solid fa-arrow-right-from-bracket me-1"></i> <span data-i18n="btn_logout">Logout</span>
            </button>

          </div>
        </div>
      </div>
    </nav>

    <div id="mainContent" class="container-fluid max-width-md" style="max-width: 1200px; padding-bottom: 50px;">
      <div class="text-center py-5 text-muted">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br>
        <span data-i18n="msg_loading">Loading System...</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  
  <!-- 🌟 ดึงไฟล์แปลภาษาที่เราแยกไว้เข้ามาใช้งาน -->
  <script src="assets/js/i18n.js"></script>

  <script>
    const SUPABASE_URL = 'https://trrfwszgscftnybhhsor.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_SyOGO6gN7DGYmj0ltcvokg_y3WOtZdH'; 
    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 

    window.addEventListener('load', async () => {
      await loadLoginComponent();
      checkSession();
      setLanguage(currentLang);
    });

    async function loadLoginComponent() {
      try {
        const response = await fetch('Login.html');
        if (!response.ok) throw new Error("File Login.html not found");
        const htmlText = await response.text();
        const container = document.getElementById('loginComponent');
        container.innerHTML = htmlText;
        
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) newScript.src = oldScript.src;
          if (oldScript.innerHTML) newScript.innerHTML = oldScript.innerHTML;
          document.body.appendChild(newScript);
        });
      } catch (error) {
        console.error(error);
        document.getElementById('loginComponent').innerHTML = `<div class="alert alert-danger text-center">❌ Failed to load Login.html</div>`;
      }
    }

    async function loadComponent(page) {
      let url = '';
      
      switch(page) {
        case 'dashboard': url = 'Dashboard.html'; break;
        case 'visit': url = 'ManageVisits.html'; break;
        case 'doctor': url = 'ManageDoctors.html'; break;
        case 'hospital': url = 'ManageHospitals.html'; break;
        case 'organization': url = 'ManageOrganization.html'; break; 
        case 'target': url = 'ManageTarget.html'; break;
        case 'matrix': url = 'ManageMatrix.html'; break; 
        case 'assignment': url = 'ManageAssignment.html'; break;
        case 'indexData': url = 'ManageIndex.html'; break;
        case 'dcr': url = 'ManageDCR.html'; break;
        case 'media': url = 'ManageMedia.html'; break;
        case 'user': url = 'ManageUsers.html'; break;
        default: 
          page = 'visit'; 
          url = 'ManageVisits.html'; 
      }

      const menuItems = document.querySelectorAll('.nav-menu-item');
      menuItems.forEach(item => item.classList.remove('active'));

      const targetMenu = document.querySelector(`.nav-menu-item[data-page="${page}"]`);
      if (targetMenu) {
        targetMenu.classList.add('active');
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('File not found ' + url);
        const html = await response.text();
        
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = html;

        const scriptElements = mainContent.querySelectorAll('script');
        scriptElements.forEach(s => {
          const code = s.textContent || s.innerText;
          const newScript = document.createElement('script');
          if (s.src) {
            newScript.src = s.src;
          } else if (code) {
            newScript.text = code;
          }
          document.head.appendChild(newScript).parentNode.removeChild(newScript);
        });
        
        const navbarCollapse = document.getElementById('navbarNav');
        if (navbarCollapse && navbarCollapse.classList.contains('show')) {
           const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
           if(bsCollapse) bsCollapse.hide();
        }
        
        setLanguage(currentLang);

      } catch (error) {
        console.error('Error loading component:', error);
        document.getElementById('mainContent').innerHTML = `<div class="alert alert-danger m-4 text-center fw-bold">❌ ${t('msg_load_failed')} (${url})<br>${t('msg_check_file')}</div>`;
      }
    }

    function checkSession() {
      const userStr = sessionStorage.getItem('crmUser');
      const loginScreen = document.getElementById('loginScreen'); 
      const appContainer = document.getElementById('appContainer');

      if (userStr) {
        const user = JSON.parse(userStr);
        
        if (loginScreen) {
          loginScreen.classList.remove('d-flex');
          loginScreen.classList.add('d-none');
        }
        if (appContainer) appContainer.style.display = 'block';
        
        const nameDisplay = document.getElementById('displayUserName');
        const roleDisplay = document.getElementById('displayUserRole');
        const dName = user.Rep_Name || user.rep_name || user.name || user.Email || user.email;
        const uRole = user.Role || user.role || 'User';
        
        if(nameDisplay) nameDisplay.innerText = dName; 
        if(roleDisplay) roleDisplay.innerText = uRole;
        
        const adminItems = document.querySelectorAll('.admin-only');
        adminItems.forEach(el => {
          if (uRole === 'Admin') {
            el.style.setProperty('display', 'block', 'important');
          } else {
            el.style.setProperty('display', 'none', 'important');
          }
        });

        loadComponent('visit');

      } else {
        if (loginScreen) {
          loginScreen.classList.remove('d-none');
          loginScreen.classList.add('d-flex');
        }
        if (appContainer) appContainer.style.display = 'none';
      }
    }

    function logout() { 
      sessionStorage.clear();
      localStorage.clear();
      window.location.reload(true); 
    }
  </script>
</body>
</html>
