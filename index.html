<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* 🌟 ส่วนที่ 2: ปรับพื้นหลังของเนื้อหาหลักให้เป็นสีขาว */
    body { background-color: #ffffff; font-family: 'Segoe UI', sans-serif; }
    #appContainer { display: none; } 
    
    /* 🌟 ส่วนที่ 1: ปรับสีพื้นหลังแถบเมนูให้เป็นสีฟ้าเทาอ่อนๆ (Soft Blue-Gray) ถนอมสายตา */
    .navbar { 
      background-color: #f0f4f8 !important; 
      border-bottom: 1px solid #dce2e8; 
    }
    
    #mainContent { margin-top: 20px; }

    /* ตกแต่งเมนูทั่วไป */
    .nav-menu-item {
      color: #495057; 
      font-weight: 500;
      padding: 8px 12px !important; 
      border-radius: 50px; 
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      margin: 0 2px;
      text-decoration: none;
      white-space: nowrap; 
    }
    
    /* 🎨 Theme สีเฉพาะของแต่ละเมนู */
    .menu-visit i { color: #198754; }
    .menu-visit:hover { background-color: #eaf6ec; color: #146c43; }
    .menu-visit.active { background-color: #d1e7dd !important; color: #146c43 !important; font-weight: 700; }

    .menu-doctor i { color: #0d6efd; }
    .menu-doctor:hover { background-color: #eff5ff; color: #084298; }
    .menu-doctor.active { background-color: #cfe2ff !important; color: #084298 !important; font-weight: 700; }

    .menu-hospital i { color: #0dcaf0; }
    .menu-hospital:hover { background-color: #eafafc; color: #05a0c0; }
    .menu-hospital.active { background-color: #cff4fc !important; color: #055160 !important; font-weight: 700; }

    .menu-org i { color: #6f42c1; }
    .menu-org:hover { background-color: #f4effa; color: #502b8e; }
    .menu-org.active { background-color: #e0cffc !important; color: #502b8e !important; font-weight: 700; }

    .menu-matrix i { color: #fd7e14; }
    .menu-matrix:hover { background-color: #fff4ec; color: #cc5900; }
    .menu-matrix.active { background-color: #ffe5d0 !important; color: #cc5900 !important; font-weight: 700; }

    .menu-assign i { color: #6610f2; }
    .menu-assign:hover { background-color: #f2eefd; color: #4309a3; }
    .menu-assign.active { background-color: #e0d4fc !important; color: #4309a3 !important; font-weight: 700; }

    .menu-setting i { color: #6c757d; }
    .menu-setting:hover { background-color: #f0f1f2; color: #383d41; }
    .menu-setting.active { background-color: #e2e3e5 !important; color: #383d41 !important; font-weight: 700; }

    .menu-dcr i { color: #dc3545; }
    .menu-dcr:hover { background-color: #fdf3f4; color: #b02a37; }
    .menu-dcr.active { background-color: #f8d7da !important; color: #842029 !important; font-weight: 700; }

    .menu-user i { color: #d63384; }
    .menu-user:hover { background-color: #fdf1f6; color: #a62364; }
    .menu-user.active { background-color: #f7d6e6 !important; color: #a62364 !important; font-weight: 700; }
  </style>
</head>
<body>

  <div id="loginComponent"></div>

  <div id="appContainer">
    <nav class="navbar navbar-expand-xl navbar-light sticky-top">
      <div class="container-fluid px-3">
        
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center me-3" href="#" onclick="loadComponent('dashboard')">
          <div class="bg-primary text-white rounded p-2 me-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
            <i class="fa-solid fa-briefcase-medical fs-6"></i>
          </div>
          CRM System
        </a>
        
        <button class="navbar-toggler border-0 shadow-sm bg-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
          
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center" style="font-size: 0.9rem;">
            
            <li class="nav-item"><a class="nav-link nav-menu-item menu-visit" href="#" data-page="visit" onclick="loadComponent('visit')"><i class="fa-solid fa-calendar-check me-1"></i> บันทึกเยี่ยม</a></li>
            <li class="nav-item"><a class="nav-link nav-menu-item menu-doctor" href="#" data-page="doctor" onclick="loadComponent('doctor')"><i class="fa-solid fa-user-doctor me-1"></i> แพทย์</a></li>
            <li class="nav-item"><a class="nav-link nav-menu-item menu-hospital" href="#" data-page="hospital" onclick="loadComponent('hospital')"><i class="fa-solid fa-hospital me-1"></i> โรงพยาบาล</a></li>
            
            <div class="vr mx-2 text-muted d-none d-xl-block admin-only" style="display: none !important; opacity: 0.2;"></div>

            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item menu-org" href="#" data-page="organization" onclick="loadComponent('organization')"><i class="fa-solid fa-sitemap me-1"></i> โครงสร้าง</a></li>
            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item menu-matrix" href="#" data-page="matrix" onclick="loadComponent('matrix')"><i class="fa-solid fa-border-all me-1"></i> Matrix</a></li>
            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item menu-assign" href="#" data-page="assignment" onclick="loadComponent('assignment')"><i class="fa-solid fa-link me-1"></i> Assignment</a></li>
            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item menu-setting" href="#" data-page="indexData" onclick="loadComponent('indexData')"><i class="fa-solid fa-list-ul me-1"></i> ตั้งค่า</a></li>
            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item menu-dcr" href="#" data-page="dcr" onclick="loadComponent('dcr')"><i class="fa-solid fa-file-signature me-1"></i> อนุมัติ DCR</a></li>
            <li class="nav-item admin-only" style="display: none;"><a class="nav-link nav-menu-item menu-user" href="#" data-page="user" onclick="loadComponent('user')"><i class="fa-solid fa-users me-1"></i> ผู้ใช้</a></li>
          </ul>

          <div class="d-flex align-items-center border-start border-secondary-subtle ps-3 ms-2 mt-3 mt-xl-0">
            <div class="text-end me-3">
              <div class="fw-bold text-dark" id="displayUserName" style="font-size: 0.85rem;">-</div>
              <div class="text-muted" id="displayUserRole" style="font-size: 0.75rem;">-</div>
            </div>
            <button class="btn btn-outline-danger btn-sm fw-bold rounded-pill px-3 bg-white shadow-sm" onclick="logout()">
              <i class="fa-solid fa-arrow-right-from-bracket me-1"></i> ออกจากระบบ
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div id="mainContent" class="container-fluid max-width-md" style="max-width: 1200px; padding-bottom: 50px;">
      <div class="text-center py-5 text-muted"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br>กำลังโหลดระบบ...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  
  <script>
    const SUPABASE_URL = 'https://trrfwszgscftnybhhsor.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_SyOGO6gN7DGYmj0ltcvokg_y3WOtZdH'; 
    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 

    window.addEventListener('load', async () => {
      await loadLoginComponent();
      checkSession();
    });

    async function loadLoginComponent() {
      try {
        const response = await fetch('Login.html');
        if (!response.ok) throw new Error("ไม่พบไฟล์ Login.html");
        const htmlText = await response.text();
        const container = document.getElementById('loginComponent');
        container.innerHTML = htmlText;
        
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) newScript.src = oldScript.src;
          if (oldScript.innerHTML) newScript.innerHTML = oldScript.innerHTML;
          document.body.appendChild(newScript);
        });
      } catch (error) {
        console.error(error);
        document.getElementById('loginComponent').innerHTML = `<div class="alert alert-danger text-center">❌ โหลดไฟล์ Login.html ล้มเหลว</div>`;
      }
    }

    async function loadComponent(page) {
      let url = '';
      
      switch(page) {
        case 'dashboard': url = 'Dashboard.html'; break;
        case 'visit': url = 'ManageVisits.html'; break;
        case 'doctor': url = 'ManageDoctors.html'; break;
        case 'hospital': url = 'ManageHospitals.html'; break;
        case 'organization': url = 'ManageOrganization.html'; break; 
        case 'matrix': url = 'ManageMatrix.html'; break; 
        case 'assignment': url = 'ManageAssignment.html'; break;
        case 'indexData': url = 'ManageIndex.html'; break;
        case 'dcr': url = 'ManageDCR.html'; break;
        case 'user': url = 'ManageUsers.html'; break;
        default: 
          page = 'visit'; 
          url = 'ManageVisits.html'; 
      }

      const menuItems = document.querySelectorAll('.nav-menu-item');
      menuItems.forEach(item => item.classList.remove('active'));

      const targetMenu = document.querySelector(`.nav-menu-item[data-page="${page}"]`);
      if (targetMenu) {
        targetMenu.classList.add('active');
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('ไม่พบไฟล์ ' + url);
        const html = await response.text();
        
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = html;

        const scripts = mainContent.querySelectorAll('script');
        scripts.forEach(script => {
          const newScript = document.createElement('script');
          if(script.src) newScript.src = script.src;
          if(script.textContent) newScript.textContent = script.textContent;
          document.body.appendChild(newScript);
        });
        
        const navbarCollapse = document.getElementById('navbarNav');
        if (navbarCollapse && navbarCollapse.classList.contains('show')) {
           const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
           if(bsCollapse) bsCollapse.hide();
        }
        
      } catch (error) {
        console.error('Error loading component:', error);
        document.getElementById('mainContent').innerHTML = `<div class="alert alert-danger m-4 text-center fw-bold">❌ ไม่สามารถโหลดหน้าจอได้ (${url})<br>โปรดตรวจสอบว่าสร้างไฟล์นี้ไว้แล้วหรือยัง</div>`;
      }
    }

    function checkSession() {
      const userStr = sessionStorage.getItem('crmUser');
      const loginScreen = document.getElementById('loginScreen'); 
      const appContainer = document.getElementById('appContainer');

      if (userStr) {
        const user = JSON.parse(userStr);
        
        if (loginScreen) {
          loginScreen.classList.remove('d-flex');
          loginScreen.classList.add('d-none');
        }
        if (appContainer) appContainer.style.display = 'block';
        
        const nameDisplay = document.getElementById('displayUserName');
        const roleDisplay = document.getElementById('displayUserRole');
        const dName = user.Rep_Name || user.rep_name || user.name || user.Email || user.email;
        const uRole = user.Role || user.role || 'User';
        
        if(nameDisplay) nameDisplay.innerText = "👨‍💼 " + dName; 
        if(roleDisplay) roleDisplay.innerText = "⭐ " + uRole;
        
        const adminItems = document.querySelectorAll('.admin-only');
        adminItems.forEach(el => {
          if (uRole === 'Admin') {
            el.style.setProperty('display', el.classList.contains('vr') ? 'block' : 'block', 'important');
          } else {
            el.style.setProperty('display', 'none', 'important');
          }
        });

        loadComponent('visit');

      } else {
        if (loginScreen) {
          loginScreen.classList.remove('d-none');
          loginScreen.classList.add('d-flex');
        }
        if (appContainer) appContainer.style.display = 'none';
      }
    }

    async function saveUserLog(user, action, duration = "-") {
      try {
        let repId = user.Rep_ID || user.id;
        if (!repId) repId = null;

        const logData = {
          Action: action,            
          Role: user.Role || user.role || "-",           
          Device: navigator.userAgent, 
          "Session Duration": duration, 
          Whoupdated: user.Email || user.email || "System",
          Whenupdated: new Date().toISOString()
        };

        if (repId) logData.Rep_ID = repId;

        await supabaseClient.from('User_Logs').insert([logData]);
      } catch (err) { 
        console.error("System Log error:", err); 
      }
    }

    function logout() { 
      const userStr = sessionStorage.getItem('crmUser');
      const loginTime = sessionStorage.getItem('loginTime');

      if (userStr) {
        const user = JSON.parse(userStr);
        let sessionDuration = "-";
        if (loginTime) {
          const diffMs = Date.now() - parseInt(loginTime);
          sessionDuration = Math.round(diffMs / 60000) + " mins";
        }
        saveUserLog(user, "Logout", sessionDuration);
      }
      sessionStorage.removeItem('crmUser');
      sessionStorage.removeItem('loginTime'); 
      checkSession();
    }
  </script>
</body>
</html>
