  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
    #appContainer { display: none; } 
    
    /* 🌟 Navbar สไตล์ Modern Corporate Clean */
    .navbar { 
      background-color: #ffffff !important; 
      border-bottom: 1px solid #e9ecef; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.04) !important;
      padding-top: 10px;
      padding-bottom: 10px;
    }
    
    #mainContent { margin-top: 20px; }

    /* 🎨 คุมโทนสีเมนูแคปซูลสวยงาม */
    .nav-menu-item {
      color: #475569; 
      font-weight: 600;
      padding: 8px 18px !important; 
      border-radius: 50px; 
      transition: all 0.2s ease-in-out;
      display: inline-flex;
      align-items: center;
      margin: 0 2px;
      text-decoration: none;
      white-space: nowrap; 
      font-size: 0.92rem;
    }
    
    .nav-menu-item i {
      color: #0d6efd;
      transition: color 0.2s ease;
    }

    .nav-menu-item:hover { 
      background-color: #f0f5ff; 
      color: #0d6efd; 
    }

    .nav-menu-item.active { 
      background-color: #0d6efd !important; 
      color: #ffffff !important; 
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
    }
    .nav-menu-item.active i { 
      color: #ffffff !important; 
    }

    /* 🌟 Dropdown สไตล์ Admin Tools */
    .admin-dropdown-menu {
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 8px;
      min-width: 220px;
    }
    .admin-dropdown-menu .dropdown-item {
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 500;
      color: #334155;
      transition: all 0.2s;
    }
    .admin-dropdown-menu .dropdown-item:hover {
      background-color: #f0f5ff;
      color: #0d6efd;
    }
    .admin-dropdown-menu .dropdown-item i {
      width: 22px;
      color: #0d6efd;
    }

    /* ปุ่มสลับภาษา */
    .lang-btn-group .btn {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* User Profile Pill */
    .user-profile-pill {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 50px;
      padding: 4px 12px 4px 8px;
    }
  </style>

        lbl_hosp_name_en: "ชื่อโรงพยาบาล (EN)",
        lbl_known_as_th: "ชื่อเรียก (TH)",
        lbl_province_zone: "จังหวัด (โซน)",
        lbl_sales_id: "รหัสฝ่ายขาย (Sales ID)",
        lbl_full_address: "ที่อยู่ฉบับเต็ม",
        btn_submit_dcr: "ส่งคำขอ DCR",

        tab_general_info: "ข้อมูลทั่วไป",
        tab_affiliated_doctors: "แพทย์ในสังกัด",
        title_affiliated_doctors: "รายชื่อแพทย์สังกัดโรงพยาบาลนี้"
      }
    };

    var currentLang = localStorage.getItem('appLang') || 'en';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('appLang', lang);

      const btnEN = document.getElementById('btnLangEN');
      const btnTH = document.getElementById('btnLangTH');
      if (btnEN && btnTH) {
        if (lang === 'th') {
          btnTH.className = "btn btn-primary";
          btnEN.className = "btn btn-outline-primary";
        } else {
          btnEN.className = "btn btn-primary";
          btnTH.className = "btn btn-outline-primary";
        }
      }

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18nDictionary[lang] && i18nDictionary[lang][key]) {
          if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            el.placeholder = i18nDictionary[lang][key];
          } else if (el.tagName === 'OPTION') {
            el.text = i18nDictionary[lang][key];
          } else {
            el.innerText = i18nDictionary[lang][key];
          }
        }
      });

      const updateTsPlaceholder = (id, key) => {
        const ts = document.getElementById(id)?.tomselect;
        if (ts) {
          ts.settings.placeholder = t(key);
          ts.inputState();
        }
      };

      updateTsPlaceholder('filterVisitDoctor', 'opt_all_doctors');
      updateTsPlaceholder('filterVisitHospital', 'opt_all_hospitals');
      updateTsPlaceholder('visitDocId', 'opt_search_doc');
      updateTsPlaceholder('visitProductId', 'opt_select_products');

      updateTsPlaceholder('filterDocName', 'opt_all_doctors');
      updateTsPlaceholder('filterDocWorkplace', 'opt_all_hospitals');
      updateTsPlaceholder('filterDocSpecialty', 'opt_all_specialties');
      updateTsPlaceholder('filterDocType', 'opt_all_types');

      updateTsPlaceholder('filterHospName', 'opt_all_hospitals');
      updateTsPlaceholder('filterHospProvince', 'opt_all_provinces');
      updateTsPlaceholder('filterHospZone', 'opt_all_zones');

      if (typeof setupFiltersDropdowns === 'function') {
        const crmUser = JSON.parse(sessionStorage.getItem('crmUser') || '{}');
        setupFiltersDropdowns(crmUser, window.VisitManagerCache?.teamProdLinks);
      }
    }

    function t(key) {
      return (i18nDictionary[currentLang] && i18nDictionary[currentLang][key]) 
        ? i18nDictionary[currentLang][key] 
        : key;
    }

    window.addEventListener('load', async () => {
      await loadLoginComponent();
      checkSession();
      setLanguage(currentLang);
    });

    async function loadLoginComponent() {
      try {
        const response = await fetch('Login.html');
        if (!response.ok) throw new Error("File Login.html not found");
        const htmlText = await response.text();
        const container = document.getElementById('loginComponent');
        container.innerHTML = htmlText;
        
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) newScript.src = oldScript.src;
          if (oldScript.innerHTML) newScript.innerHTML = oldScript.innerHTML;
          document.body.appendChild(newScript);
        });
      } catch (error) {
        console.error(error);
        document.getElementById('loginComponent').innerHTML = `<div class="alert alert-danger text-center">❌ Failed to load Login.html</div>`;
      }
    }

    async function loadComponent(page) {
      let url = '';
      
      switch(page) {
        case 'dashboard': url = 'Dashboard.html'; break;
        case 'visit': url = 'ManageVisits.html'; break;
        case 'doctor': url = 'ManageDoctors.html'; break;
        case 'hospital': url = 'ManageHospitals.html'; break;
        case 'organization': url = 'ManageOrganization.html'; break; 
        case 'matrix': url = 'ManageMatrix.html'; break; 
        case 'assignment': url = 'ManageAssignment.html'; break;
        case 'indexData': url = 'ManageIndex.html'; break;
        case 'dcr': url = 'ManageDCR.html'; break;
        case 'user': url = 'ManageUsers.html'; break;
        default: 
          page = 'visit'; 
          url = 'ManageVisits.html'; 
      }

      const menuItems = document.querySelectorAll('.nav-menu-item');
      menuItems.forEach(item => item.classList.remove('active'));

      const targetMenu = document.querySelector(`.nav-menu-item[data-page="${page}"]`);
      if (targetMenu) {
        targetMenu.classList.add('active');
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('File not found ' + url);
        const html = await response.text();
        
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = html;

        const scripts = mainContent.querySelectorAll('script');
        scripts.forEach(script => {
          const newScript = document.createElement('script');
          if(script.src) newScript.src = script.src;
          if(script.textContent) newScript.textContent = script.textContent;
          document.body.appendChild(newScript);
        });
        
        const navbarCollapse = document.getElementById('navbarNav');
        if (navbarCollapse && navbarCollapse.classList.contains('show')) {
           const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
           if(bsCollapse) bsCollapse.hide();
        }
        
        setLanguage(currentLang);

      } catch (error) {
        console.error('Error loading component:', error);
        document.getElementById('mainContent').innerHTML = `<div class="alert alert-danger m-4 text-center fw-bold">❌ ${t('msg_load_failed')} (${url})<br>${t('msg_check_file')}</div>`;
      }
    }

    function checkSession() {
      const userStr = sessionStorage.getItem('crmUser');
      const loginScreen = document.getElementById('loginScreen'); 
      const appContainer = document.getElementById('appContainer');

      if (userStr) {
        const user = JSON.parse(userStr);
        
        if (loginScreen) {
          loginScreen.classList.remove('d-flex');
          loginScreen.classList.add('d-none');
        }
        if (appContainer) appContainer.style.display = 'block';
        
        const nameDisplay = document.getElementById('displayUserName');
        const roleDisplay = document.getElementById('displayUserRole');
        const dName = user.Rep_Name || user.rep_name || user.name || user.Email || user.email;
        const uRole = user.Role || user.role || 'User';
        
        if(nameDisplay) nameDisplay.innerText = dName; 
        if(roleDisplay) roleDisplay.innerText = uRole;
        
        const adminItems = document.querySelectorAll('.admin-only');
        adminItems.forEach(el => {
          if (uRole === 'Admin') {
            el.style.setProperty('display', 'block', 'important');
          } else {
            el.style.setProperty('display', 'none', 'important');
          }
        });

        loadComponent('visit');

      } else {
        if (loginScreen) {
          loginScreen.classList.remove('d-none');
          loginScreen.classList.add('d-flex');
        }
        if (appContainer) appContainer.style.display = 'none';
      }
    }

    async function saveUserLog(user, action, duration = "-") {
      try {
        let repId = user.Rep_ID || user.id;
        if (!repId) repId = null;

        const logData = {
          Action: action,            
          Role: user.Role || user.role || "-",           
          Device: navigator.userAgent, 
          "Session Duration": duration, 
          Whoupdated: user.Email || user.email || "System",
          Whenupdated: new Date().toISOString()
        };

        if (repId) logData.Rep_ID = repId;

        await supabaseClient.from('User_Logs').insert([logData]);
      } catch (err) { 
        console.error("System Log error:", err); 
      }
    }

    function logout() { 
      const userStr = sessionStorage.getItem('crmUser');
      const loginTime = sessionStorage.getItem('loginTime');

      if (userStr) {
        const user = JSON.parse(userStr);
        let sessionDuration = "-";
        if (loginTime) {
          const diffMs = Date.now() - parseInt(loginTime);
          sessionDuration = Math.round(diffMs / 60000) + " mins";
        }
        saveUserLog(user, "Logout", sessionDuration);
      }

      sessionStorage.clear();
      localStorage.clear();

      window.VisitManagerCache = null;
      window.DocManagerCache = null;
      window.HospManagerCache = null;
      
      if (typeof globalDoctors !== 'undefined') globalDoctors = [];
      if (typeof globalHospitals !== 'undefined') globalHospitals = [];
      if (typeof globalVisits !== 'undefined') globalVisits = [];
      
      window.location.reload(true); 
    }
  </script>
</body>
