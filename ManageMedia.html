<style>
  .media-card {
    border-radius: 16px !important;
    border: 1px solid #eef2f6 !important;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03) !important;
    background: #ffffff;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .media-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.08) !important;
  }
  .preview-box {
    height: 160px;
    background-color: #000000;
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
</style>

<div class="container-fluid p-0" style="max-width: 1200px; margin: 0 auto;">
  
  <!-- Header Section -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div>
      <h3 class="text-dark fw-bold mb-1"><i class="fa-solid fa-file-powerpoint text-danger me-2"></i>Media Management (e-Detailing)</h3>
      <p class="text-muted small mb-0">จัดการคลังสื่อการนำเสนอ สไลด์ PDF และวิดีโอสำหรับฝ่ายขาย</p>
    </div>
    
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary fw-bold rounded-pill px-3 shadow-sm" onclick="loadMediaList(true)">
        <i class="fa-solid fa-arrows-rotate me-1"></i> Refresh
      </button>
      <button class="btn btn-primary fw-bold rounded-pill px-4 shadow-sm" onclick="openAddMediaModal()">
        <i class="fa-solid fa-cloud-arrow-up me-2"></i> Upload New Media
      </button>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="card p-3 border-0 shadow-sm media-card mb-4">
    <div class="row g-2 align-items-center">
      <div class="col-12 col-md-5">
        <div class="input-group border rounded-pill bg-white shadow-xs overflow-hidden">
          <span class="input-group-text bg-transparent border-0 ps-3 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" class="form-control border-0 bg-transparent shadow-none" id="searchMediaInput" placeholder="ค้นหาชื่อสื่อ หรือชื่อผลิตภัณฑ์..." onkeyup="filterMediaList()">
        </div>
      </div>
      <div class="col-6 col-md-3">
        <select class="form-select border rounded-pill shadow-none" id="filterMediaType" onchange="filterMediaList()">
          <option value="">- ทุกประเภท (PDF & Video) -</option>
          <option value="PDF">📄 PDF Presentation</option>
          <option value="Video">🎬 Video Presentation</option>
        </select>
      </div>
      <div class="col-6 col-md-4">
        <select class="form-select border rounded-pill shadow-none" id="filterMediaProduct" onchange="filterMediaList()">
          <option value="">- ผลิตภัณฑ์ทั้งหมด -</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Media Cards Grid List -->
  <div class="row g-4" id="mediaGridContainer">
    <div class="col-12 text-center py-5 text-muted">
      <i class="fa-solid fa-spinner fa-spin fa-2x mb-3 text-primary"></i><br>กำลังโหลดคลังสื่อการนำเสนอ...
    </div>
  </div>

</div>

<!-- 📤 Modal อัปโหลด / แก้ไขสื่อ -->
<div class="modal fade" id="mediaFormModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-bottom py-3 px-4">
        <h5 class="modal-title fw-bold text-primary" id="mediaModalTitle">📤 Upload New Media</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <form id="mediaUploadForm" onsubmit="handleSaveMedia(event)">
        <div class="modal-body p-4">
          <input type="hidden" id="mediaId">
          <input type="hidden" id="existingFileUrl">

          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-bold text-dark">ชื่อสื่อนำเสนอ (Title) <span class="text-danger">*</span></label>
              <input type="text" class="form-control rounded-3" id="mediaTitle" placeholder="เช่น Polivy Clinical Trial Highlights 2026" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold text-dark">ผลิตภัณฑ์ที่เกี่ยวข้อง (Product) <span class="text-danger">*</span></label>
              <select class="form-select rounded-3" id="mediaProduct" required></select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold text-dark">ทีมที่เกี่ยวข้อง (Team) <span class="text-muted">(Optional)</span></label>
              <select class="form-select rounded-3" id="mediaTeam"></select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold text-dark">ประเภทสื่อ (Type) <span class="text-danger">*</span></label>
              <select class="form-select rounded-3" id="mediaType" required onchange="toggleFileTypeHint()">
                <option value="PDF">📄 PDF Presentation (.pdf)</option>
                <option value="Video">🎬 Video (.mp4 / .webm)</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold text-dark">สถานะการใช้งาน (Status)</label>
              <select class="form-select rounded-3 fw-bold" id="mediaStatus">
                <option value="true" class="text-success">✅ Active (เปิดใช้งาน)</option>
                <option value="false" class="text-danger">🚫 Inactive (ยกเลิก/ห้ามใช้)</option>
              </select>
            </div>

            <!-- Upload File Box -->
            <div class="col-12 mt-3">
              <label class="form-label fw-bold text-dark" id="fileUploadLabel">อัปโหลดไฟล์สื่อ <span class="text-danger">*</span></label>
              <input type="file" class="form-control rounded-3" id="mediaFileInput" accept=".pdf,.mp4,.webm">
              <div class="form-text small text-muted" id="fileTypeHint">รองรับไฟล์เอกสาร PDF ไม่เกิน 50MB</div>
              <div class="text-truncate text-primary small mt-1 fw-semibold d-none" id="currentFileDisplay"></div>
            </div>
          </div>
        </div>

        <div class="modal-footer border-top py-3 px-4">
          <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm" id="btnSaveMedia">
            💾 Save Media
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  var globalAllMediaList = [];
  var globalProductsList = [];
  var globalTeamList = [];

  setTimeout(async function() {
    await loadMediaDropdowns();
    await loadMediaList();
  }, 100);

  async function loadMediaDropdowns() {
    try {
      var prodRes = await supabaseClient.from('Products').select('*').order('Product', { ascending: true });
      var teamRes = await supabaseClient.from('Team').select('*').order('Team', { ascending: true });

      globalProductsList = prodRes.data || [];
      globalTeamList = teamRes.data || [];

      // Fill Form & Filter Products
      var prodSelect = document.getElementById('mediaProduct');
      var filterProd = document.getElementById('filterMediaProduct');
      var prodHtml = '<option value="">-- เลือกผลิตภัณฑ์ --</option>';
      var filterProdHtml = '<option value="">- ผลิตภัณฑ์ทั้งหมด -</option>';

      globalProductsList.forEach(function(p) {
        prodHtml += '<option value="' + p.Product_ID + '">' + p.Product + '</option>';
        filterProdHtml += '<option value="' + p.Product_ID + '">' + p.Product + '</option>';
      });
      if (prodSelect) prodSelect.innerHTML = prodHtml;
      if (filterProd) filterProd.innerHTML = filterProdHtml;

      // Fill Form Teams
      var teamSelect = document.getElementById('mediaTeam');
      var teamHtml = '<option value="">-- เลือกทีม (ไม่บังคับ) --</option>';
      globalTeamList.forEach(function(t) {
        teamHtml += '<option value="' + t.Team_ID + '">' + t.Team + '</option>';
      });
      if (teamSelect) teamSelect.innerHTML = teamHtml;

    } catch(e) {
      console.error("Load Media Dropdowns Error:", e);
    }
  }

  async function loadMediaList(forceReload) {
    var container = document.getElementById('mediaGridContainer');
    try {
      var res = await supabaseClient.from('Detailing_Media').select('*').order('Whenupdated', { ascending: false });
      if (res.error) throw res.error;

      globalAllMediaList = res.data || [];
      filterMediaList();

    } catch(err) {
      console.error("Load Media List Error:", err);
      if (container) container.innerHTML = '<div class="col-12 text-center text-danger py-4">❌ ไม่สามารถโหลดข้อมูลสื่อได้: ' + err.message + '</div>';
    }
  }

  function filterMediaList() {
    var container = document.getElementById('mediaGridContainer');
    if (!container) return;

    var searchVal = document.getElementById('searchMediaInput') ? document.getElementById('searchMediaInput').value.trim().toLowerCase() : '';
    var typeVal = document.getElementById('filterMediaType') ? document.getElementById('filterMediaType').value : '';
    var prodVal = document.getElementById('filterMediaProduct') ? document.getElementById('filterMediaProduct').value : '';

    var filtered = globalAllMediaList.filter(function(m) {
      var matchSearch = true;
      if (searchVal) {
        var pObj = globalProductsList.find(function(p) { return String(p.Product_ID) === String(m.Product_ID); });
        var pName = pObj ? pObj.Product.toLowerCase() : '';
        var fullText = (m.Title || '').toLowerCase() + ' ' + pName;
        matchSearch = fullText.indexOf(searchVal) !== -1;
      }

      var matchType = (typeVal === '' || m.Type === typeVal);
      var matchProd = (prodVal === '' || String(m.Product_ID) === String(prodVal));

      return matchSearch && matchType && matchProd;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="fa-solid fa-folder-open fs-2 mb-2 d-block opacity-50"></i>ไม่พบสื่อนำเสนอในระบบ</div>';
      return;
    }

    var html = '';
    filtered.forEach(function(m) {
      var pObj = globalProductsList.find(function(p) { return String(p.Product_ID) === String(m.Product_ID); });
      var productName = pObj ? pObj.Product : 'ไม่ระบุยา';
      var statusBadge = m.Status ? '<span class="badge bg-success-subtle text-success border border-success-subtle">Active</span>' : '<span class="badge bg-danger-subtle text-danger border border-danger-subtle">Inactive</span>';
      var icon = m.Type === 'Video' ? 'fa-circle-play text-danger' : 'fa-file-pdf text-danger';

      html += 
        '<div class="col-12 col-sm-6 col-lg-4">' +
          '<div class="card media-card overflow-hidden h-100">' +
            '<div class="preview-box">' +
              (m.Type === 'Video' 
                ? '<video src="' + m.File_URL + '" style="max-height:100%; max-width:100%;"></video><i class="fa-solid fa-circle-play position-absolute text-white opacity-75 fs-1"></i>' 
                : '<iframe src="' + m.File_URL + '#page=1&toolbar=0" style="width:100%; height:100%; border:none; pointer-events:none;"></iframe>') +
            '</div>' +
            '<div class="card-body p-3 d-flex flex-column justify-content-between">' +
              '<div>' +
                '<div class="d-flex justify-content-between align-items-center mb-1">' +
                  '<span class="badge bg-primary-subtle text-primary fw-bold">' + productName + '</span>' +
                  statusBadge +
                '</div>' +
                '<h6 class="fw-bold text-dark mb-2 text-truncate" title="' + m.Title + '">' + m.Title + '</h6>' +
              '</div>' +
              '<div class="d-flex justify-content-between align-items-center pt-2 border-top mt-2">' +
                '<small class="text-muted"><i class="fa-solid ' + icon + ' me-1"></i>' + (m.Type || 'PDF') + '</small>' +
                '<div class="btn-group btn-group-sm">' +
                  '<a href="' + m.File_URL + '" target="_blank" class="btn btn-outline-secondary" title="View File"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>' +
                  '<button type="button" class="btn btn-outline-primary" onclick="openEditMediaModal(\'' + m.Media_ID + '\')"><i class="fa-solid fa-pen"></i> Edit</button>' +
                  '<button type="button" class="btn btn-outline-danger" onclick="deleteMedia(\'' + m.Media_ID + '\')"><i class="fa-solid fa-trash"></i></button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    });

    container.innerHTML = html;
  }

  function toggleFileTypeHint() {
    var type = document.getElementById('mediaType').value;
    var hint = document.getElementById('fileTypeHint');
    var input = document.getElementById('mediaFileInput');

    if (type === 'Video') {
      if (hint) hint.innerText = 'รองรับไฟล์วิดีโอ MP4, WebM ไม่เกิน 100MB';
      if (input) input.accept = '.mp4,.webm';
    } else {
      if (hint) hint.innerText = 'รองรับไฟล์เอกสาร PDF ไม่เกิน 50MB';
      if (input) input.accept = '.pdf';
    }
  }

  function openAddMediaModal() {
    document.getElementById('mediaUploadForm').reset();
    document.getElementById('mediaId').value = '';
    document.getElementById('existingFileUrl').value = '';
    document.getElementById('mediaModalTitle').innerText = '📤 Upload New Media';
    document.getElementById('fileUploadLabel').innerHTML = 'อัปโหลดไฟล์สื่อ <span class="text-danger">*</span>';
    document.getElementById('mediaFileInput').required = true;
    document.getElementById('currentFileDisplay').classList.add('d-none');

    var modal = new bootstrap.Modal(document.getElementById('mediaFormModal'));
    modal.show();
  }

  function openEditMediaModal(mediaId) {
    var m = globalAllMediaList.find(function(x) { return String(x.Media_ID) === String(mediaId); });
    if (!m) return;

    document.getElementById('mediaId').value = m.Media_ID;
    document.getElementById('existingFileUrl').value = m.File_URL || '';
    document.getElementById('mediaModalTitle').innerText = '✏️ Edit Media Information';
    
    document.getElementById('mediaTitle').value = m.Title || '';
    document.getElementById('mediaProduct').value = m.Product_ID || '';
    document.getElementById('mediaTeam').value = m.Team_ID || '';
    document.getElementById('mediaType').value = m.Type || 'PDF';
    document.getElementById('mediaStatus').value = m.Status ? 'true' : 'false';

    document.getElementById('fileUploadLabel').innerHTML = 'เปลี่ยนไฟล์สื่อ (หากไม่เปลี่ยนให้เว้นว่างไว้)';
    document.getElementById('mediaFileInput').required = false;

    var curDisplay = document.getElementById('currentFileDisplay');
    if (curDisplay && m.File_URL) {
      curDisplay.innerHTML = '🔗 ไฟล์ปัจจุบัน: <a href="' + m.File_URL + '" target="_blank">' + m.File_URL.split('/').pop() + '</a>';
      curDisplay.classList.remove('d-none');
    }

    var modal = new bootstrap.Modal(document.getElementById('mediaFormModal'));
    modal.show();
  }

  async function handleSaveMedia(e) {
    e.preventDefault();
    var btn = document.getElementById('btnSaveMedia');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Saving...';

    var mediaId = document.getElementById('mediaId').value;
    var existingUrl = document.getElementById('existingFileUrl').value;
    var fileInput = document.getElementById('mediaFileInput');
    var file = fileInput.files[0];

    var fileUrl = existingUrl;

    try {
      // 1️⃣ ถ้ามีการเลือกไฟล์ใหม่ ให้ทำการอัปโหลดขึ้น Supabase Storage Bucket
      if (file) {
        var fileExt = file.name.split('.').pop();
        var fileName = Date.now() + '_' + Math.random().toString(36).substring(2) + '.' + fileExt;
        var filePath = 'media/' + fileName;

        var uploadRes = await supabaseClient.storage.from('detailing-media').upload(filePath, file);
        if (uploadRes.error) throw new Error("Storage Upload Error: " + uploadRes.error.message);

        // ดึง Public URL ของไฟล์ขึ้นมา
        var urlData = supabaseClient.storage.from('detailing-media').getPublicUrl(filePath);
        fileUrl = urlData.data.publicUrl;
      }

      if (!fileUrl) throw new Error("กรุณาเลือกไฟล์สื่อที่ต้องการอัปโหลด");

      var crmUser = null;
      try { crmUser = JSON.parse(sessionStorage.getItem('crmUser')); } catch(err){}
      var whoUpdated = crmUser ? (crmUser.Email || crmUser.Rep_Name || "Admin") : "Admin";

      // 2️⃣ บันทึก/อัปเดตข้อมูลลงตาราง Detailing_Media ใน Supabase
      var payload = {
        Title: document.getElementById('mediaTitle').value.trim(),
        Product_ID: document.getElementById('mediaProduct').value || null,
        Team_ID: document.getElementById('mediaTeam').value || null,
        Type: document.getElementById('mediaType').value,
        Status: document.getElementById('mediaStatus').value === 'true',
        File_URL: fileUrl,
        Whoupdated: whoUpdated,
        Whenupdated: new Date().toISOString()
      };

      if (mediaId) {
        var updRes = await supabaseClient.from('Detailing_Media').update(payload).eq('Media_ID', mediaId);
        if (updRes.error) throw updRes.error;
      } else {
        var insRes = await supabaseClient.from('Detailing_Media').insert([payload]);
        if (insRes.error) throw insRes.error;
      }

      var modalEl = document.getElementById('mediaFormModal');
      var modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();

      alert("✅ บันทึกสื่อการนำเสนอเรียบร้อยแล้ว!");
      await loadMediaList(true);

    } catch(err) {
      alert("❌ เกิดข้อผิดพลาด: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '💾 Save Media';
    }
  }

  async function deleteMedia(mediaId) {
    if (!confirm("⚠️ คุณแน่ใจหรือไม่ว่าต้องการลบสื่อการนำเสนอนี้?")) return;

    try {
      var res = await supabaseClient.from('Detailing_Media').delete().eq('Media_ID', mediaId);
      if (res.error) throw res.error;

      alert("🗑️ ลบสื่อเรียบร้อยแล้ว");
      await loadMediaList(true);
    } catch(err) {
      alert("❌ ลบไม่สำเร็จ: " + err.message);
    }
  }

  window.openAddMediaModal = openAddMediaModal;
  window.openEditMediaModal = openEditMediaModal;
  window.handleSaveMedia = handleSaveMedia;
  window.deleteMedia = deleteMedia;
  window.filterMediaList = filterMediaList;
  window.toggleFileTypeHint = toggleFileTypeHint;
</script>
