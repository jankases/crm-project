<style>
  .assign-card { border-radius: 15px; }
  .form-control, .form-select { min-height: 42px; border-radius: 10px; }
  
  .mic-active { 
    animation: pulse-red 1.5s infinite; 
    border-color: #dc3545 !important; 
  }
  @keyframes pulse-red { 
    0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); } 
    70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 
    100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } 
  }
</style>

<div class="container-fluid p-0" style="max-width: 1200px; margin: 0 auto;">
  
  <!-- ================= 1. หน้ารายชื่อ Assignment (List View) ================= -->
  <div id="assignListView">
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
      <div>
        <h3 class="text-primary fw-bold mb-1"><i class="fa-solid fa-link me-2"></i>จัดการ Assignment (Account vs Territory)</h3>
        <p class="text-muted mb-0">จับคู่กำหนดพื้นที่ความรับผิดชอบ (Territory) ให้กับแพทย์และโรงพยาบาล</p>
      </div>
      <button type="button" class="btn btn-primary fw-bold shadow-sm rounded-pill px-4 py-2" onclick="openAddAssignView()">
        <i class="fa-solid fa-plus me-2"></i>เพิ่ม Assignment ใหม่
      </button>
    </div>

    <!-- แถบ Filters ตัวกรอง -->
    <div class="row mb-4 g-2">
      <!-- 1. กรองประเภท -->
      <div class="col-md-3">
        <label class="form-label fw-bold text-secondary small mb-1">ประเภท (Type)</label>
        <select class="form-select shadow-sm" id="filterAssignType" onchange="filterAssignments()">
          <option value="">- ทุกประเภท -</option>
          <option value="Doctor">Doctor (แพทย์)</option>
          <option value="Hospital">Hospital (โรงพยาบาล)</option>
        </select>
      </div>

      <!-- 2. ค้นหา Account + ไมค์อัดเสียง -->
      <div class="col-md-5">
        <label class="form-label fw-bold text-secondary small mb-1">ค้นหา Account (ชื่อ/รหัส)</label>
        <div class="input-group shadow-sm" style="border-radius: 10px; overflow: hidden;">
          <span class="input-group-text bg-white border-end-0 py-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
          <input type="text" class="form-control border-start-0 border-end-0 ps-0" id="filterAssignAccount" placeholder="พิมพ์ชื่อ หรือ รหัส..." onkeyup="filterAssignments()">
          <button class="btn btn-outline-secondary bg-white border-start-0" type="button" id="btnMicAssignSearch" onclick="toggleAssignVoiceSearch()" title="พูดเพื่อค้นหา">
            <i class="fa-solid fa-microphone text-muted" id="micAssignSearchIcon"></i>
          </button>
        </div>
      </div>

      <!-- 3. กรอง Territory -->
      <div class="col-md-4">
        <label class="form-label fw-bold text-secondary small mb-1">เขตพื้นที่ (Territory)</label>
        <select class="form-select shadow-sm" id="filterAssignTer" onchange="filterAssignments()">
          <option value="">- ทุกพื้นที่ -</option>
        </select>
      </div>
    </div>

    <!-- ตารางแสดงรายการ -->
    <div class="card p-4 border-0 shadow-sm assign-card">
      <div class="table-responsive">
        <table class="table table-hover align-middle text-center" style="font-size: 0.95rem;">
          <thead class="table-light">
            <tr>
              <th class="py-3">Type</th>
              <th class="py-3">Account ID</th>
              <th class="py-3 text-start">Account Name</th>
              <th class="py-3">Territory</th>
              <th class="py-3">จัดการ (Action)</th>
            </tr>
          </thead>
          <tbody id="assignTableBody">
            <tr><td colspan="5" class="py-5">กำลังโหลดข้อมูล... <i class="fa-solid fa-spinner fa-spin text-primary"></i></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ================= 2. หน้าฟอร์มเพิ่ม/แก้ไข Assignment ================= -->
  <div id="assignFormView" class="d-none">
    <div class="d-flex align-items-center mb-4">
      <button class="btn btn-light border fw-bold me-3 rounded-pill px-3" onclick="switchAssignView('assignListView')">
        <i class="fa-solid fa-arrow-left me-1"></i> ย้อนกลับ
      </button>
      <h4 class="text-primary fw-bold mb-0" id="assignFormTitle">เพิ่ม Assignment ใหม่</h4>
    </div>

    <div class="card p-4 p-md-5 border-0 shadow-sm assign-card">
      <form id="assignForm" onsubmit="handleSaveAssign(event)">
        <input type="hidden" id="assignOldAccId">
        <input type="hidden" id="assignOldTerId">

        <div class="row g-3">
          <!-- ประเภท -->
          <div class="col-md-4 mb-2">
            <label class="form-label fw-bold text-dark">ประเภท (Type) <span class="text-danger">*</span></label>
            <select class="form-select bg-white shadow-sm" id="assignType" required onchange="onAssignTypeChange()">
              <option value="">- เลือกประเภท -</option>
              <option value="Doctor">Doctor (แพทย์)</option>
              <option value="Hospital">Hospital (โรงพยาบาล)</option>
            </select>
          </div>

          <!-- เลือก Account (รองรับ TomSelect ค้นหาได้) -->
          <div class="col-md-8 mb-2">
            <label class="form-label fw-bold text-dark">Account (แพทย์ / โรงพยาบาล) <span class="text-danger">*</span></label>
            <select class="form-select bg-white shadow-sm" id="assignAccount" required>
              <option value="">- กรุณาเลือกประเภทก่อน -</option>
            </select>
          </div>

          <!-- เลือก Territory -->
          <div class="col-md-12 mb-3">
            <label class="form-label fw-bold text-primary">กำหนดให้เขตพื้นที่ (Territory) <span class="text-danger">*</span></label>
            <select class="form-select bg-white shadow-sm border-primary" id="assignTerritory" required>
              <option value="">- เลือกเขตพื้นที่ -</option>
            </select>
          </div>
        </div>

        <div class="text-end border-top pt-4 mt-3 d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-light border fw-bold px-4 rounded-pill py-2" onclick="switchAssignView('assignListView')">ยกเลิก</button>
          <button type="submit" class="btn btn-primary fw-bold px-5 rounded-pill py-2 shadow-sm" id="submitAssignBtn">💾 บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

</div>

<script>
  var globalAssignList = [];
  var globalAssignDoctors = [];
  var globalAssignHospitals = [];
  var globalAssignTerritories = [];
  var isAssignDataLoaded = false;
  var isAssignEditMode = false;
  var tomSelectAccountInstance = null;

  // ===================== 🎙️ ระบบค้นหาด้วยเสียงในหน้า List View =====================
  var assignSearchRecognition = null;
  function toggleAssignVoiceSearch() {
    if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
      return alert("ขออภัยครับ เบราว์เซอร์ของคุณไม่รองรับระบบสั่งงานด้วยเสียง");
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    assignSearchRecognition = new SpeechRecognition();
    assignSearchRecognition.lang = 'th-TH';
    
    const btn = document.getElementById('btnMicAssignSearch');
    const icon = document.getElementById('micAssignSearchIcon');

    if (btn && icon) {
      btn.classList.add('btn-danger', 'mic-active', 'text-white');
      btn.classList.remove('bg-white');
      icon.classList.add('text-white', 'fa-microphone-lines', 'fa-fade');
    }

    assignSearchRecognition.onresult = function(event) {
      let spokenText = event.results[0][0].transcript.trim();
      if (spokenText) {
        document.getElementById('filterAssignAccount').value = spokenText;
        filterAssignments();
      }
      stopAssignVoiceSearch();
    };

    assignSearchRecognition.onerror = stopAssignVoiceSearch;
    assignSearchRecognition.onend = stopAssignVoiceSearch;
    assignSearchRecognition.start();
  }

  function stopAssignVoiceSearch() {
    if (assignSearchRecognition) assignSearchRecognition.stop();
    const btn = document.getElementById('btnMicAssignSearch');
    const icon = document.getElementById('micAssignSearchIcon');
    if (btn && icon) {
      btn.classList.remove('btn-danger', 'mic-active', 'text-white');
      btn.classList.add('bg-white');
      icon.classList.remove('text-white', 'fa-microphone-lines', 'fa-fade');
    }
  }

  // ===================== ระบบโหลดข้อมูลหลักจาก Supabase =====================
  setTimeout(async function() {
    await loadAssignmentData();
  }, 300);

  function switchAssignView(viewId) {
    document.getElementById('assignListView').classList.add('d-none');
    document.getElementById('assignFormView').classList.add('d-none');
    document.getElementById(viewId).classList.remove('d-none');
    window.scrollTo(0, 0);
  }

  async function loadAssignmentData() {
    isAssignDataLoaded = false;
    const tbody = document.getElementById('assignTableBody');
    tbody.innerHTML = '<tr><td colspan="5" class="py-5">กำลังโหลดข้อมูล... <i class="fa-solid fa-spinner fa-spin text-primary"></i></td></tr>';

    try {
      // 1. ดึง Master Data ทั้งหมด
      const [docRes, hospRes, terrRes, assignDocRes, assignHospRes] = await Promise.all([
        supabaseClient.from('Doctors').select('Doc_ID, Doc_Name, Doc_Name_TH').eq('Status', 'Active'),
        supabaseClient.from('Hospitals').select('Hospital_ID, Hospital, Known_As').eq('Status', 'Active'),
        supabaseClient.from('Territory').select('Territory_ID, Territory').eq('Status', 'Active'),
        supabaseClient.from('Assignment_Doctor').select('*'),
        supabaseClient.from('Assignment_Hospital').select('*')
      ]);

      globalAssignDoctors = docRes.data || [];
      globalAssignHospitals = hospRes.data || [];
      globalAssignTerritories = terrRes.data || [];

      // 2. รวมข้อมูล Assignment Doctor & Hospital เข้าด้วยกัน
      let mergedAssignments = [];

      (assignDocRes.data || []).forEach(ad => {
        const doc = globalAssignDoctors.find(d => String(d.Doc_ID) === String(ad.Doc_ID));
        const terr = globalAssignTerritories.find(t => String(t.Territory_ID) === String(ad.Territory_ID));
        mergedAssignments.push({
          type: 'Doctor',
          accountId: ad.Doc_ID,
          accountName: doc ? `${doc.Doc_Name} (${doc.Doc_Name_TH || ''})` : ad.Doc_ID,
          territoryId: ad.Territory_ID,
          territoryName: terr ? terr.Territory : ad.Territory_ID,
          compositeId: `Doctor_${ad.Doc_ID}_${ad.Territory_ID}`
        });
      });

      (assignHospRes.data || []).forEach(ah => {
        const hosp = globalAssignHospitals.find(h => String(h.Hospital_ID) === String(ah.Hospital_ID));
        const terr = globalAssignTerritories.find(t => String(t.Territory_ID) === String(ah.Territory_ID));
        mergedAssignments.push({
          type: 'Hospital',
          accountId: ah.Hospital_ID,
          accountName: hosp ? (hosp.Known_As || hosp.Hospital) : ah.Hospital_ID,
          territoryId: ah.Territory_ID,
          territoryName: terr ? terr.Territory : ah.Territory_ID,
          compositeId: `Hospital_${ah.Hospital_ID}_${ah.Territory_ID}`
        });
      });

      globalAssignList = mergedAssignments;
      isAssignDataLoaded = true;

      // เติม Options Dropdown ใน Filters และ Form
      setupTerritoryDropdowns();
      filterAssignments();

    } catch (err) {
      console.error("Error loading Assignment Data:", err);
      tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-danger">❌ เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</td></tr>`;
    }
  }

  function setupTerritoryDropdowns() {
    let terOpts = '<option value="">- ทุกพื้นที่ -</option>';
    let formTerOpts = '<option value="">- เลือกเขตพื้นที่ -</option>';
    globalAssignTerritories.forEach(t => {
      terOpts += `<option value="${t.Territory_ID}">${t.Territory}</option>`;
      formTerOpts += `<option value="${t.Territory_ID}">${t.Territory}</option>`;
    });
    document.getElementById('filterAssignTer').innerHTML = terOpts;
    document.getElementById('assignTerritory').innerHTML = formTerOpts;
  }

  function onAssignTypeChange(selectedAccId = '') {
    const type = document.getElementById('assignType').value;
    const accEl = document.getElementById('assignAccount');

    if (tomSelectAccountInstance) {
      tomSelectAccountInstance.destroy();
      tomSelectAccountInstance = null;
    }

    let html = '<option value="">- เลือก Account -</option>';

    if (type === 'Doctor') {
      globalAssignDoctors.forEach(d => {
        const nameShow = d.Doc_Name_TH ? `${d.Doc_Name} (${d.Doc_Name_TH})` : d.Doc_Name;
        html += `<option value="${d.Doc_ID}" ${String(d.Doc_ID) === String(selectedAccId) ? 'selected' : ''}>${nameShow}</option>`;
      });
    } else if (type === 'Hospital') {
      globalAssignHospitals.forEach(h => {
        const nameShow = h.Known_As ? `${h.Hospital} (${h.Known_As})` : h.Hospital;
        html += `<option value="${h.Hospital_ID}" ${String(h.Hospital_ID) === String(selectedAccId) ? 'selected' : ''}>${nameShow}</option>`;
      });
    } else {
      html = '<option value="">- กรุณาเลือกประเภทก่อน -</option>';
    }

    accEl.innerHTML = html;

    if (type && typeof TomSelect !== 'undefined') {
      tomSelectAccountInstance = new TomSelect('#assignAccount', {
        create: false,
        sortField: { field: "text", direction: "asc" },
        placeholder: "- ค้นหา/เลือก Account -"
      });
    }
  }

  function filterAssignments() {
    if (!isAssignDataLoaded) return;
    
    const typeTerm = document.getElementById('filterAssignType').value;
    const accTerm = document.getElementById('filterAssignAccount').value.toLowerCase().trim();
    const terTerm = document.getElementById('filterAssignTer').value;

    const filtered = globalAssignList.filter(a => {
      const matchType = (typeTerm === "") || (a.type === typeTerm);
      const matchTer = (terTerm === "") || (String(a.territoryId) === String(terTerm));
      const searchStr = `${a.accountId} ${a.accountName}`.toLowerCase();
      const matchAcc = (accTerm === "") || searchStr.includes(accTerm);
      return matchType && matchTer && matchAcc;
    });

    const tbody = document.getElementById('assignTableBody');
    tbody.innerHTML = '';
    
    if(!filtered.length) return tbody.innerHTML = '<tr><td colspan="5" class="text-muted py-5"><i class="fa-solid fa-folder-open fs-3 d-block mb-2"></i>ไม่พบข้อมูล Assignment</td></tr>';

    filtered.forEach(a => {
      const badge = a.type === 'Doctor' ? 'bg-info text-dark' : 'bg-warning text-dark';
      tbody.innerHTML += `
        <tr>
          <td><span class="badge ${badge} px-2 py-1">${a.type}</span></td>
          <td class="fw-bold text-muted small">${a.accountId}</td>
          <td class="text-start fw-bold text-dark">${a.accountName}</td>
          <td class="text-primary fw-bold">${a.territoryName}</td>
          <td>
            <button class="btn btn-sm btn-light border text-primary rounded-pill px-3 me-1 shadow-sm" onclick="openEditAssignView('${a.compositeId}')">
              <i class="fa-solid fa-pen"></i> แก้ไข
            </button>
            <button class="btn btn-sm btn-light border text-danger rounded-pill px-3 shadow-sm" onclick="deleteAssignment('${a.type}', '${a.accountId}', '${a.territoryId}')">
              <i class="fa-solid fa-trash"></i> ลบ
            </button>
          </td>
        </tr>`;
    });
  }

  function openAddAssignView() {
    isAssignEditMode = false;
    document.getElementById('assignFormTitle').innerText = "📝 เพิ่ม Assignment ใหม่";
    document.getElementById('assignForm').reset();
    document.getElementById('assignOldAccId').value = '';
    document.getElementById('assignOldTerId').value = '';
    document.getElementById('assignType').disabled = false;
    onAssignTypeChange();
    switchAssignView('assignFormView');
  }

  function openEditAssignView(compositeId) {
    const a = globalAssignList.find(x => x.compositeId === compositeId);
    if (!a) return;

    isAssignEditMode = true;
    document.getElementById('assignFormTitle').innerText = "✏️ แก้ไข Assignment";

    document.getElementById('assignOldAccId').value = a.accountId;
    document.getElementById('assignOldTerId').value = a.territoryId;

    document.getElementById('assignType').value = a.type;
    document.getElementById('assignType').disabled = true; // ล็อคไม่ให้เปลี่ยน Type ตอนแก้ไข
    onAssignTypeChange(a.accountId);

    document.getElementById('assignTerritory').value = a.territoryId;

    switchAssignView('assignFormView');
  }

  // 🌟 บันทึกข้อมูลลง Supabase
  async function handleSaveAssign(e) {
    e.preventDefault();
    const btn = document.getElementById('submitAssignBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>กำลังบันทึก...';

    const type = document.getElementById('assignType').value;
    const accountId = document.getElementById('assignAccount').value;
    const territoryId = document.getElementById('assignTerritory').value;
    const oldAccId = document.getElementById('assignOldAccId').value;
    const oldTerId = document.getElementById('assignOldTerId').value;

    const tableName = (type === 'Doctor') ? 'Assignment_Doctor' : 'Assignment_Hospital';
    const accCol = (type === 'Doctor') ? 'Doc_ID' : 'Hospital_ID';

    try {
      if (isAssignEditMode) {
        // ลบอันเก่าออกก่อนแล้วเขียนอันใหม่ลงไป
        await supabaseClient.from(tableName).delete().eq(accCol, oldAccId).eq('Territory_ID', oldTerId);
      }

      const payload = {};
      payload[accCol] = accountId;
      payload['Territory_ID'] = territoryId;

      const { error } = await supabaseClient.from(tableName).insert([payload]);
      if (error) throw error;

      alert("✅ บันทึก Assignment เรียบร้อยแล้ว");
      switchAssignView('assignListView');
      await loadAssignmentData();

    } catch(err) {
      alert("❌ เกิดข้อผิดพลาด: " + err.message);
    } finally {
      btn.disabled = false; btn.innerHTML = "💾 บันทึกข้อมูล";
    }
  }

  // 🌟 ลบ Assignment จาก Supabase
  async function deleteAssignment(type, accountId, territoryId) {
    if (!confirm(`คุณต้องการลบการแมปพื้นที่สำหรับรายการนี้ใช่หรือไม่?`)) return;

    const tableName = (type === 'Doctor') ? 'Assignment_Doctor' : 'Assignment_Hospital';
    const accCol = (type === 'Doctor') ? 'Doc_ID' : 'Hospital_ID';

    try {
      const { error } = await supabaseClient.from(tableName).delete().eq(accCol, accountId).eq('Territory_ID', territoryId);
      if (error) throw error;

      alert("✅ ลบรายการเรียบร้อยแล้ว");
      await loadAssignmentData();
    } catch(err) {
      alert("❌ ไม่สามารถลบได้: " + err.message);
    }
  }
</script>
